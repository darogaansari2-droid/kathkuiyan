<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>श्री कृष्ण इंटर कॉलेज - वेतन कैलकुलेटर</title>
    <style>
        /* स्क्रीन फिक्सिंग स्टाइल */
        body, html { height: 100%; margin: 0; padding: 0; overflow: hidden; background-color: #f4f7f6; font-family: 'Segoe UI', sans-serif; }
        .main-wrapper { height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 10px; box-sizing: border-box; overflow-y: auto; }
        
        .container { width: 100%; max-width: 800px; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h1, h2 { text-align: center; color: #1a2a6c; margin-top: 0; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #2c3e50; color: white; }
        .input-group { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .input-box { flex: 1; min-width: 150px; }
        input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #27ae60; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .result-box { margin-top: 15px; padding: 10px; background: #e8f6f3; border-left: 5px solid #27ae60; }
        .diff-box { background: #fff3cd; border: 1px solid #ffeeba; padding: 10px; margin-top: 10px; font-weight: bold; }
        
        /* स्वतंत्र कैलकुलेटर */
        .independent-calc { width: 100%; max-width: 800px; border: 2px solid #2c3e50; padding: 15px; background: #fdfdfd; border-radius: 10px; }
    </style>
</head>
<body>

<div class="main-wrapper">
    <!-- मुख्य वेतन कैलकुलेटर -->
    <div class="container">
        <h1>श्री कृष्ण इण्टर कॉलेज सेमरा, कठकुइयाँ</h1>
        <table>
            <tr><th>घटक</th><th>दर (%)</th></tr>
            <tr><td>महंगाई भत्ता (DA)</td><td><input type="number" id="daPercent" value="60" oninput="calculateSalary()"></td></tr>
            <tr><td>वेतन वृद्धि</td><td><input type="number" id="hikePercent" value="25" oninput="calculateSalary()"></td></tr>
        </table>
        <div class="input-group">
            <div class="input-box"><label>मूल वेतन:</label><input type="number" id="currentPay" value="40400" oninput="calculateSalary()"></div>
            <div class="input-box"><label>फिटमेंट:</label><input type="number" id="fitment" value="2.57" oninput="calculateSalary()"></div>
            <div class="input-box"><label>HRA (₹):</label><input type="number" id="hraAmount" value="2000" oninput="calculateSalary()"></div>
        </div>
        <button onclick="calculateSalary()">गणना करें</button>
        <div id="result" class="result-box" style="display:none;">
            <p><strong>नया मूल वेतन:</strong> ₹<span id="outBasic"></span></p>
            <div class="diff-box">वेतन में अंतर: ₹<span id="outDiff"></span></div>
            <p>कुल वेतन (Gross): <strong>₹<span id="outTotal"></span></strong></p>
        </div>
    </div>

    <!-- स्वतंत्र गणितीय कैलकुलेटर -->
    <div class="independent-calc">
        <h2 style="margin: 0 0 10px 0; font-size: 18px;"> कैलकुलेटर</h2>
        <input type="text" id="mathInput" placeholder="यहाँ गणित लिखें (उदा: 500*2+50)" oninput="mathCalc()" style="padding: 10px; font-size: 16px;">
        <div style="margin-top: 10px; font-weight: bold; color: #d35400;">परिणाम: <span id="mathOutput">0</span></div>
    </div>
</div>

<script>
    function calculateSalary() {
        const cp = parseFloat(document.getElementById('currentPay').value) || 0;
        const h = parseFloat(document.getElementById('hikePercent').value) || 0;
        const f = parseFloat(document.getElementById('fitment').value) || 0;
        const da = parseFloat(document.getElementById('daPercent').value) || 0;
        const hra = parseFloat(document.getElementById('hraAmount').value) || 0;
        
        let basic = Math.round(((cp * f) * (1 + h/100)) / 100) * 100;
        let diff = basic - cp;
        let total = basic + (basic * da/100) + hra;

        document.getElementById('outBasic').innerText = basic.toLocaleString('en-IN');
        document.getElementById('outDiff').innerText = diff.toLocaleString('en-IN');
        document.getElementById('outTotal').innerText = Math.round(total).toLocaleString('en-IN');
        document.getElementById('result').style.display = 'block';
    }

    function mathCalc() {
        const input = document.getElementById('mathInput').value;
        try {
            const res = eval(input);
            document.getElementById('mathOutput').innerText = isNaN(res) ? "0" : res.toLocaleString('en-IN');
        } catch(e) { document.getElementById('mathOutput').innerText = "0"; }
    }
</script>

</body>
</html>
