<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>श्री कृष्ण इण्टरमीडिएट कालेज - समय सारिणी प्रबंधन</title>
    <style>
        @import url('https://fonts.Nirmal UI/css2?family=Poppins:wght@400;500;600;700&family=Teko:wght@500;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f0f2f5;
            color: #000;
            padding: 10px;
        }

        .container {
            max-width: 1480px;
            margin: 0 auto;
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* School Header */
        .school-header {
            text-align: center;
            margin-bottom: 10px;
            border-bottom: 2px double #000;
            padding-bottom: 8px;
        }

        .school-header h1 {
            font-family: 'Teko', sans-serif;
            font-size: 22px;
            color: #000;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .school-header h2 {
            font-size: 15px;
            color: #000;
            margin-top: 2px;
            font-weight: 600;
        }

        /* Controls & Session Input */
        .top-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: #e8f4f1;
            padding: 8px 12px;
            border-radius: 6px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .session-box label {
            font-weight: 600;
            color: #000;
            font-size: 12px;
        }

        .session-box input, .print-select, .recess-select {
            padding: 4px 6px;
            font-size: 12px;
            border: 1px solid #666;
            border-radius: 4px;
            margin-left: 3px;
            font-family: 'Poppins', sans-serif;
        }

        .setting-save-btn {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 5px 9px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 4px;
        }

        .setting-save-btn:hover {
            background-color: #1b5e20;
        }

        .setting-reset-btn {
            background-color: #c62828;
            color: white;
            border: none;
            padding: 5px 9px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
            margin-left: 4px;
        }

        .setting-reset-btn:hover {
            background-color: #8e0000;
        }

        .tab-buttons {
            display: flex;
            gap: 8px;
        }

        .tab-btn {
            background-color: #ddd;
            border: none;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background-color: #000;
            color: #fff;
        }

        /* Quick Entry Form Styling */
        .quick-entry-box {
            background: #fafafa;
            border: 1px solid #bbb;
            padding: 12px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .quick-entry-box h3 {
            font-size: 13px;
            margin-bottom: 10px;
            font-weight: 600;
            color: #003366;
        }

        .timetable-section {
            display: none;
        }

        .timetable-section.active {
            display: block;
        }

        .section-title {
            text-align: center;
            font-size: 16px;
            margin-bottom: 8px;
            color: #000;
            font-weight: 600;
        }

        /* Table Design */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
            margin-bottom: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: var(--font-size, 11px);
            background: #fff;
        }

        th, td {
            border: 1px solid #000;
            padding: var(--row-padding, 6px) var(--col-width-factor, 4px);
            text-align: center;
            vertical-align: middle;
            color: #000;
        }

        th {
            background-color: #dcdcdc !important;
            color: #000 !important;
            font-weight: 700;
            font-size: calc(var(--font-size, 11px) + 1px);
        }

        input.editable-cell {
            width: 100%;
            border: none !important;
            outline: none !important;
            background: transparent;
            text-align: center;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: var(--font-size, 11px);
            padding: 2px;
            color: #000;
            box-shadow: none !important;
        }

        input.editable-cell:focus {
            background: #f0f0f0;
            outline: 1px solid #000 !important;
        }

        textarea.editable-cell {
            width: 100%;
            border: none !important;
            outline: none !important;
            background: transparent;
            text-align: center;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            font-size: var(--font-size, 11px);
            resize: none !important;
            overflow: hidden;
            min-height: var(--textarea-min-height, 32px);
            line-height: 1.3;
            color: #000;
            box-shadow: none !important;
        }

        textarea.editable-cell.period-8-cell {
            font-size: var(--p8-font-size, 9px) !important;
        }

        textarea.editable-cell:focus {
            background: #f0f0f0;
            outline: 1px solid #000 !important;
        }

        .quick-textarea {
            width: 100%;
            padding: 4px;
            font-size: 11px;
            font-weight: 600;
            color: #000;
            border: 1px solid #888;
            border-radius: 3px;
            font-family: 'Poppins', sans-serif;
            resize: vertical;
            height: 45px;
            text-align: center;
        }

        /* Placeholder formatting for clear visibility */
        .quick-textarea::placeholder, input::placeholder {
            color: #555;
            font-weight: 600;
            opacity: 1;
        }

        .break-cell {
            background-color: #eaeaea !important;
            font-weight: bold;
            color: #000;
            writing-mode: vertical-rl;
            transform: rotate(180deg);
            padding: 4px !important;
            letter-spacing: 2px;
            font-size: var(--font-size, 11px);
            text-align: center;
            vertical-align: middle;
            border: 1px solid #000 !important;
        }

        .action-btns {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            align-items: center;
        }

        .btn {
            padding: 5px 10px;
            font-size: 12px;
            font-weight: 600;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-add {
            background-color: #333;
            color: white;
        }

        .btn-add:hover { background-color: #000; }

        .row-action-group {
            display: flex;
            gap: 2px;
            justify-content: center;
            align-items: center;
        }

        .btn-action-mini {
            background-color: #444;
            color: white;
            border: none;
            padding: 2px 4px;
            font-size: 9px;
            cursor: pointer;
            border-radius: 3px;
        }

        .btn-action-mini:hover { background-color: #000; }

        .btn-del {
            background-color: #c62828;
        }
        .btn-del:hover { background-color: #8e0000; }

        .print-btn {
            background-color: #000;
            color: white;
            padding: 8px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 3px 6px rgba(0,0,0,0.3);
        }

        .print-btn:hover { background-color: #333; }

        @media print {
            @page {
                size: A4 landscape;
                margin: 5mm;
            }

            body {
                background: #fff !important;
                padding: 0 !important;
                margin: 0 !important;
                color: #000 !important;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }

            .container {
                box-shadow: none !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
            }

            .top-controls, .btn-add, .print-btn, .no-print, .quick-entry-box {
                display: none !important;
            }

            .timetable-section {
                display: none !important;
            }

            .timetable-section.print-active {
                display: block !important;
            }

            #table-format-2 th:first-child,
            #table-format-2 td:first-child {
                display: none !important;
            }

            table {
                font-size: var(--font-size, 10px) !important;
                width: 100% !important;
                border-collapse: collapse !important;
                page-break-inside: auto !important;
            }

            tr {
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }

            thead {
                display: table-header-group !important;
            }

            th, td {
                border: 1px solid #000 !important;
                padding: var(--row-padding, 5px) var(--col-width-factor, 3px) !important;
                color: #000 !important;
            }

            th {
                background-color: #dcdcdc !important;
                color: #000 !important;
            }

            .break-cell {
                border: 1px solid #000 !important;
                background-color: #eaeaea !important;
            }

            input.editable-cell, textarea.editable-cell {
                border: none !important;
                outline: none !important;
                background: transparent !important;
                box-shadow: none !important;
                font-size: var(--font-size, 10px) !important;
                font-weight: 600 !important;
                color: #000 !important;
                resize: none !important;
                -webkit-text-fill-color: #000 !important;
            }

            textarea.editable-cell.period-8-cell {
                font-size: var(--p8-font-size, 9px) !important;
                -webkit-text-fill-color: #000 !important;
            }
        }
    </style>
</head>
<body id="bodyRoot" style="--row-padding: 6px; --col-width-factor: 4px; --textarea-min-height: 32px; --font-size: 11px; --p8-font-size: 9px;">

<div class="container">
    <!-- School Header -->
    <div class="school-header">
        <h1>श्री कृष्ण इण्टरमीडिएट कालेज, सेमरा कठकुइयाँ, कुशीनगर</h1>
        <h2> समय सारिणी सत्र - <span id="display-session">2026-27</span></h2>
    </div>

    <!-- Top Controls & Session & Settings -->
    <div class="top-controls">
        <div class="session-box">
            <label for="sessionInput">सत्र:</label>
            <input type="text" id="sessionInput" value="2026-27" style="width: 55px;" oninput="updateSession(this.value)">
            
            <label for="recessAfter" style="margin-left: 3px;">मध्यान्तर:</label>
            <select id="recessAfter" class="recess-select" onchange="renderTables()">
                <option value="3">III बाद</option>
                <option value="4" selected>IV बाद</option>
                <option value="5">V बाद</option>
                <option value="6">VI बाद</option>
            </select>

            <label for="rowPaddingInput" style="margin-left: 3px;">रो ऊंचाई:</label>
            <input type="number" id="rowPaddingInput" value="6" min="2" max="20" style="width: 38px;" oninput="updateRowHeight(this.value)"> px

            <label for="colWidthInput" style="margin-left: 3px;">कॉलम चौड़ाई:</label>
            <input type="number" id="colWidthInput" value="4" min="2" max="20" style="width: 38px;" oninput="updateColWidth(this.value)"> px

            <label for="fontSizeInput" style="margin-left: 3px;">फॉन्ट:</label>
            <input type="number" id="fontSizeInput" value="11" min="7" max="16" style="width: 40px;" oninput="updateFontSize(this.value)"> px

            <label for="p8FontSizeInput" style="margin-left: 3px;">8वी घंटी फॉन्ट:</label>
            <input type="number" id="p8FontSizeInput" value="9" min="6" max="16" style="width: 40px;" oninput="updateP8FontSize(this.value)"> px

            <label for="printSelect" style="margin-left: 3px;">प्रिंट मोड:</label>
            <select id="printSelect" class="print-select" onchange="onPrintSelectChange(this.value)">
                <option value="1">फॉर्मेट 1</option>
                <option value="2">फॉर्मेट 2</option>
            </select>

            <button class="setting-save-btn" onclick="saveSettings()">💾 सेव</button>
            <button class="setting-reset-btn" onclick="resetSettings()">🔄 रीसेट</button>
        </div>

        <div class="tab-buttons">
            <button class="tab-btn active" id="btn-tab-1" onclick="switchTab(1)">फॉर्मेट 1: अध्यापकवार</button>
            <button class="tab-btn" id="btn-tab-2" onclick="switchTab(2)">फॉर्मेट 2: कक्षावार</button>
        </div>
    </div>

    <!-- QUICK ENTRY FORM FOR FORMAT 1 (TEACHER) -->
    <div id="quick-form-1" class="quick-entry-box no-print">
        <h3>📝 त्वरित प्रविष्टि / अपडेट फॉर्म (अध्यापकवार)</h3>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; align-items: flex-end;">
            <div style="width: 140px;">
                <label style="font-size: 11px; font-weight: 600;">क्रम संख्या (Kramank):</label><br>
                <input type="number" id="q1SNo" min="1" placeholder="जैसे: 1" style="width: 100%; padding: 5px; font-size: 11px; font-weight: 600; color: #000; border: 1px solid #888; border-radius: 3px;">
            </div>
            <div style="flex-grow: 1; min-width: 200px;">
                <label style="font-size: 11px; font-weight: 600;">अध्यापक का नाम (Name):</label><br>
                <input type="text" id="q1Name" placeholder="अध्यापक का पूरा नाम या नाम से खोजें" style="width: 100%; padding: 5px; font-size: 11px; font-weight: 600; color: #000; border: 1px solid #888; border-radius: 3px;">
            </div>
            <div>
                <button class="setting-save-btn" onclick="searchData1()" style="padding: 6px 12px; font-size: 11px; background-color: #003366;">🔍 खोजें (Search)</button>
            </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin-bottom: 10px;">
            <div><label style="font-size: 10px; font-weight: 600;">I घंटी:</label><textarea id="q1P0" class="quick-textarea" placeholder=""></textarea></div>
            <div><label style="font-size: 10px; font-weight: 600;">II घंटी:</label><textarea id="q1P1" class="quick-textarea" placeholder=""></textarea></div>
            <div><label style="font-size: 10px; font-weight: 600;">III घंटी:</label><textarea id="q1P2" class="quick-textarea" placeholder=""></textarea></div>
            <div><label style="font-size: 10px; font-weight: 600;">IV घंटी:</label><textarea id="q1P3" class="quick-textarea" placeholder=""></textarea></div>
            <div><label style="font-size: 10px; font-weight: 600;">V घंटी:</label><textarea id="q1P4" class="quick-textarea" placeholder=""></textarea></div>
            <div><label style="font-size: 10px; font-weight: 600;">VI घंटी:</label><textarea id="q1P5" class="quick-textarea" placeholder=""></textarea></div>
            <div><label style="font-size: 10px; font-weight: 600;">VII घंटी:</label><textarea id="q1P6" class="quick-textarea" placeholder=""></textarea></div>
            <div><label style="font-size: 10px; font-weight: 600;">VIII घंटी:</label><textarea id="q1P7" class="quick-textarea" placeholder=""></textarea></div>
        </div>
        <button class="setting-save-btn" onclick="applyQuickEntry1()" style="padding: 6px 14px; font-size: 12px;">✅ प्रविष्टि जोड़ें / अपडेट करें</button>
    </div>

    <!-- QUICK ENTRY FORM FOR FORMAT 2 (CLASS) -->
    <div id="quick-form-2" class="quick-entry-box no-print" style="display: none;">
        <h3>📝 त्वरित प्रविष्टि / अपडेट फॉर्म (कक्षावार)</h3>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; align-items: flex-end;">
            <div style="width: 140px;">
                <label style="font-size: 11px; font-weight: 600;">क्रम संख्या / क्रमांक:</label><br>
                <input type="number" id="q2SNo" min="1" placeholder="जैसे: 1" style="width: 100%; padding: 5px; font-size: 11px; font-weight: 600; color: #000; border: 1px solid #888; border-radius: 3px;">
            </div>
            <div style="flex-grow: 1; min-width: 200px;">
                <label style="font-size: 11px; font-weight: 600;">कक्षा का नाम (Class):</label><br>
                <input type="text" id="q2Class" placeholder="जैसे: XII A या नाम से खोजें" style="width: 100%; padding: 5px; font-size: 11px; font-weight: 600; color: #000; border: 1px solid #888; border-radius: 3px;">
            </div>
            <div>
                <button class="setting-save-btn" onclick="searchData2()" style="padding: 6px 12px; font-size: 11px; background-color: #003366;">🔍 खोजें (Search)</button>
            </div>
        </div>
        <div style="display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; margin-bottom: 10px;">
            <div><label style="font-size: 10px; font-weight: 600;">I घंटी:</label><textarea id="q2P0" class="quick-textarea" placeholder="विषय&#10;अध्यापक"></textarea></div>
            <div><label style="font-size: 10px; font-weight: 600;">II घंटी:</label><textarea id="q2P1" class="quick-textarea" placeholder="विषय&#10;अध्यापक"></textarea></div>
            <div><label style="font-size: 10px; font-weight: 600;">III घंटी:</label><textarea id="q2P2" class="quick-textarea" placeholder="विषय&#10;अध्यापक"></textarea></div>
            <div><label style="font-size: 10px; font-weight: 600;">IV घंटी:</label><textarea id="q2P3" class="quick-textarea" placeholder="विषय&#10;अध्यापक"></textarea></div>
            <div><label style="font-size: 10px; font-weight: 600;">V घंटी:</label><textarea id="q2P4" class="quick-textarea" placeholder="विषय&#10;अध्यापक"></textarea></div>
            <div><label style="font-size: 10px; font-weight: 600;">VI घंटी:</label><textarea id="q2P5" class="quick-textarea" placeholder="विषय&#10;अध्यापक"></textarea></div>
            <div><label style="font-size: 10px; font-weight: 600;">VII घंटी:</label><textarea id="q2P6" class="quick-textarea" placeholder="विषय&#10;अध्यापक"></textarea></div>
            <div><label style="font-size: 10px; font-weight: 600;">VIII घंटी:</label><textarea id="q2P7" class="quick-textarea" placeholder="विषय&#10;अध्यापक"></textarea></div>
        </div>
        <button class="setting-save-btn" onclick="applyQuickEntry2()" style="padding: 6px 14px; font-size: 12px;">✅ प्रविष्टि जोड़ें / अपडेट करें</button>
    </div>

    <!-- FORMAT 1: अध्यापकवार समय सारिणी -->
    <div id="section-1" class="timetable-section active">
        <div class="section-title">अध्यापकवार समय सारिणी (Teacher-wise Timetable)</div>
        <div class="table-responsive">
            <table id="table-format-1">
                <thead id="thead-f1"></thead>
                <tbody id="tbody-f1"></tbody>
            </table>
        </div>
        <div class="action-btns">
            <button class="btn btn-add" onclick="addRowF1(-1)">+ नया अध्यापक जोड़ें (अंत में)</button>
        </div>
    </div>

    <!-- FORMAT 2: कक्षावार समय सारिणी -->
    <div id="section-2" class="timetable-section">
        <div class="section-title">कक्षावार समय सारिणी (Class-wise Timetable)</div>
        <div class="table-responsive">
            <table id="table-format-2">
                <thead id="thead-f2"></thead>
                <tbody id="tbody-f2"></tbody>
            </table>
        </div>
        <div class="action-btns">
            <button class="btn btn-add" onclick="addRowF2(-1)">+ नई कक्षा जोड़ें (अंत में)</button>
        </div>
    </div>

    <!-- Print Control -->
    <div style="text-align: center; margin-top: 15px;" class="top-controls">
        <button class="print-btn" onclick="triggerPrint()">🖨 चयनित समय सारिणी प्रिंट करें</button>
    </div>
</div>

<script>
    let defaultDataF1 = [
        {name: "श्री चन्द्र भूषण पाठक", periods: ["-", "-", "XII A\nभूगोल", "-", "XI A\nभूगोल", "-", "-", "-", "भूगोल प्रयो०\nXIIA(सो०मं०बु०)\nXIA(वृ०शु०श०)"]},
        {name: "श्री मनोज कुमार", periods: ["XII A\nअर्थशास्त्र", "-", "VIII A\nगणित", "XI A\nअर्थशास्त्र", "-", "VII A\nगणित", "-", "-", "पी०टी०\nVIII A"]},
        {name: "श्री रमेन्द्र नाथ तिवारी", periods: ["-", "VI A\nसंस्कृत", "-", "X A\nसंस्कृत", "-", "-", "VI A\nगृह शिल्प", "-", "-"]},

    // Search Data for Format 1 (Teacher)
    function searchData1() {
        let sNo = parseInt(document.getElementById('q1SNo').value);
        let nameQuery = document.getElementById('q1Name').value.trim().toLowerCase();
        let foundIndex = -1;

        if (!isNaN(sNo) && sNo > 0) {
            foundIndex = sNo - 1;
        } else if (nameQuery !== "") {
            foundIndex = dataF1.findIndex(item => item.name.toLowerCase().includes(nameQuery));
        }

        if (foundIndex >= 0 && foundIndex < dataF1.length) {
            let item = dataF1[foundIndex];
            document.getElementById('q1SNo').value = foundIndex + 1;
            document.getElementById('q1Name').value = item.name;
            for (let i = 0; i < 8; i++) {
                document.getElementById('q1P' + i).value = item.periods[i] === "-" ? "" : (item.periods[i] || "");
            }
            alert(`🔍 अध्यापक मिल गए: '${item.name}' (क्रम सं० ${foundIndex + 1}). अब आप इसे बदलकर अपडेट कर सकते हैं!`);
        } else {
            alert('❌ कोई रिकॉर्ड नहीं मिला! कृपया सही क्रम संख्या या नाम दर्ज करें।');
        }
    }

    function loadSavedSettings() {
        const savedSettings = localStorage.getItem('skic_timetable_settings');
        if (savedSettings) {
            try {
                const settings = JSON.parse(savedSettings);
                if (settings.session) {
                    document.getElementById('sessionInput').value = settings.session;
                    updateSession(settings.session);
                }
                if (settings.recess) document.getElementById('recessAfter').value = settings.recess;
                if (settings.rowPadding) {
                    document.getElementById('rowPaddingInput').value = settings.rowPadding;
                    updateRowHeight(settings.rowPadding);
                }
                if (settings.colWidth) {
                    document.getElementById('colWidthInput').value = settings.colWidth;
                    updateColWidth(settings.colWidth);
                }
                if (settings.fontSize) {
                    document.getElementById('fontSizeInput').value = settings.fontSize;
                    updateFontSize(settings.fontSize);
                }
                if (settings.p8FontSize) {
                    document.getElementById('p8FontSizeInput').value = settings.p8FontSize;
                    updateP8FontSize(settings.p8FontSize);
                }
                if (settings.printMode) {
                    document.getElementById('printSelect').value = settings.printMode;
                    onPrintSelectChange(settings.printMode);
                }
            } catch (e) {
                console.error("Error loading settings", e);
            }
        }

        const savedF1 = localStorage.getItem('skic_timetable_dataF1');
        if (savedF1) {
            try { dataF1 = JSON.parse(savedF1); } catch (e) { console.error(e); }
        }

        const savedF2 = localStorage.getItem('skic_timetable_dataF2');
        if (savedF2) {
            try { dataF2 = JSON.parse(savedF2); } catch (e) { console.error(e); }
        }
    }

    function renderTables() {
        const recessAfter = parseInt(document.getElementById('recessAfter').value);
        
        // --- Render Table 1 ---
        const thead1 = document.getElementById('thead-f1');
        let hRow1 = `<tr><th style="width: 3.5%;">क्रम सं०</th><th style="width: 12%;">कक्षाध्यापक का नाम</th>`;
        for (let i = 0; i < 8; i++) {
            hRow1 += `<th style="width: 9%;">${periodNames[i]}</th>`;
            if (i + 1 === recessAfter) {
                hRow1 += `<th style="width: 4%;">मध्यान्तर</th>`;
            }
        }
        hRow1 += `<th style="width: 6%;" class="no-print">कार्रवाई</th></tr>`;
        thead1.innerHTML = hRow1;

        const tbody1 = document.getElementById('tbody-f1');
        tbody1.innerHTML = '';
        dataF1.forEach((row, index) => {
            let tr = document.createElement('tr');
            let html = `<td>${index + 1}</td><td><input type="text" class="editable-cell" value="${row.name}" onchange="dataF1[${index}].name=this.value"></td>`;
            
            for (let i = 0; i < 8; i++) {
                let pVal = row.periods[i] || "-";
                let extraClass = (i === 7) ? " editable-cell period-8-cell" : " editable-cell";
                html += `<td><textarea class="${extraClass}" onchange="dataF1[${index}].periods[${i}]=this.value">${pVal}</textarea></td>`;
                if (i + 1 === recessAfter) {
                    html += `<td class="break-cell">मध्यान्तर</td>`;
                }
            }
            html += `<td class="no-print">
                        <div class="row-action-group">
                            <button class="btn-action-mini" title="ऊपर करें" onclick="moveRowF1(${index}, -1)">⬆️</button>
                            <button class="btn-action-mini" title="नीचे करें" onclick="moveRowF1(${index}, 1)">⬇️</button>
                            <button class="btn-action-mini" title="यहाँ नया जोड़ें" onclick="addRowF1(${index})">➕</button>
                            <button class="btn-action-mini btn-del" title="हटाएं" onclick="deleteRowF1(${index})">❌</button>
                        </div>
                     </td>`;
            tr.innerHTML = html;
            tbody1.appendChild(tr);
        });

        // --- Render Table 2 ---
        const thead2 = document.getElementById('thead-f2');
        let hRow2 = `<tr><th style="width: 4%;">क्रम सं०</th><th style="width: 8%;">कक्षा</th>`;
        for (let i = 0; i < 8; i++) {
            hRow2 += `<th style="width: 10%;">${periodNames[i]}</th>`;
            if (i + 1 === recessAfter) {
                hRow2 += `<th style="width: 4%;">मध्यान्तर</th>`;
            }
        }
        hRow2 += `<th style="width: 6%;" class="no-print">कार्रवाई</th></tr>`;
        thead2.innerHTML = hRow2;

        const tbody2 = document.getElementById('tbody-f2');
        tbody2.innerHTML = '';
        dataF2.forEach((row, index) => {
            let tr = document.createElement('tr');
            let html = `<td>${index + 1}</td><td><input type="text" class="editable-cell" value="${row.cls}" onchange="dataF2[${index}].cls=this.value"></td>`;
            
            for (let i = 0; i < 8; i++) {
                let pVal = row.periods[i] || "-";
                let extraClass = (i === 7) ? " editable-cell period-8-cell" : " editable-cell";
                html += `<td><textarea class="${extraClass}" onchange="dataF2[${index}].periods[${i}]=this.value">${pVal}</textarea></td>`;
                if (i + 1 === recessAfter) {
                    html += `<td class="break-cell">मध्यान्तर</td>`;
                }
            }
            html += `<td class="no-print">
                        <div class="row-action-group">
                            <button class="btn-action-mini" title="ऊपर करें" onclick="moveRowF2(${index}, -1)">⬆️</button>
                            <button class="btn-action-mini" title="नीचे करें" onclick="moveRowF2(${index}, 1)">⬇️</button>
                            <button class="btn-action-mini" title="यहाँ नया जोड़ें" onclick="addRowF2(${index})">➕</button>
                            <button class="btn-action-mini btn-del" title="हटाएं" onclick="deleteRowF2(${index})">❌</button>
                        </div>
                     </td>`;
            tr.innerHTML = html;
            tbody2.appendChild(tr);
        });
    }

    function addRowF1(index) {
        const newRow = {name: "नया अध्यापक", periods: ["-","-","-","-","-","-","-","-"]};
        if (index === -1) {
            dataF1.push(newRow);
        } else {
            dataF1.splice(index + 1, 0, newRow);
        }
        renderTables();
    }

    function moveRowF1(index, direction) {
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= dataF1.length) return;
        const temp = dataF1[index];
        dataF1[index] = dataF1[targetIndex];
        dataF1[targetIndex] = temp;
        renderTables();
    }

    function deleteRowF1(index) {
        if (dataF1.length <= 1) {
            alert('कम से कम एक अध्यापक होना आवश्यक है!');
            return;
        }
        dataF1.splice(index, 1);
        renderTables();
    }

    function addRowF2(index) {
        const newRow = {cls: "नयी कक्षा", periods: ["-","-","-","-","-","-","-","-"]};
        if (index === -1) {
            dataF2.push(newRow);
        } else {
            dataF2.splice(index + 1, 0, newRow);
        }
        renderTables();
    }

    function moveRowF2(index, direction) {
        const targetIndex = index + direction;
        if (targetIndex < 0 || targetIndex >= dataF2.length) return;
        const temp = dataF2[index];
        dataF2[index] = dataF2[targetIndex];
        dataF2[targetIndex] = temp;
        renderTables();
    }

    function deleteRowF2(index) {
        if (dataF2.length <= 1) {
            alert('कम से कम एक कक्षा होनी आवश्यक है!');
            return;
        }
        dataF2.splice(index, 1);
        renderTables();
    }

    function switchTab(formatNum) {
        document.querySelectorAll('.timetable-section').forEach(sec => sec.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

        document.getElementById('section-' + formatNum).classList.add('active');
        document.getElementById('btn-tab-' + formatNum).classList.add('active');
        document.getElementById('printSelect').value = formatNum;

        if (formatNum === 1) {
            document.getElementById('quick-form-1').style.display = 'block';
            document.getElementById('quick-form-2').style.display = 'none';
        } else {
            document.getElementById('quick-form-1').style.display = 'none';
            document.getElementById('quick-form-2').style.display = 'block';
        }
    }

    function onPrintSelectChange(val) {
        switchTab(parseInt(val));
    }

    function triggerPrint() {
        const selectedVal = document.getElementById('printSelect').value;
        
        document.querySelectorAll('.timetable-section').forEach(sec => sec.classList.remove('print-active'));
        document.getElementById('section-' + selectedVal).classList.add('print-active');
        
        window.print();
    }

    window.onload = function() {
        loadSavedSettings();
        renderTables();
    };
</script>

</body>
</html>
