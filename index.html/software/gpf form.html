<!DOCTYPE html>
<html lang="hi">
<head>

    <title>Compact Data Entry Form - Clean Labels</title>

    <style>
        html, body {
            margin: 0;

            font-family: Arial, sans-serif;
            background-color: #f4f1ea; /* Halka Bhura Background */
            box-sizing: border-box;
            height: 100%;
        }

        /* 🔒 LOGIN OVERLAY STYLES */
        #login-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            padding: 15px;
            box-sizing: border-box;
        }

        .login-box {
            background: #ffffff;
            padding: 25px 20px;
            border-radius: 10px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 320px;
            text-align: center;
            border: 3px solid #3e2723;
            box-sizing: border-box;
        }

        .login-box h2 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #3e2723;
            font-size: 20px;
        }

        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-size: 13px;
            font-weight: bold;
            width: 100%;
        }

        .input-group input {
            width: 100% !important;
            padding: 8px;
            border: 2px solid #3e2723;
            border-radius: 4px;
            font-size: 15px;
            background: #fff;
            color: #000;
            box-sizing: border-box;
            height: 38px;
        }

        .login-btn {
            width: 100%;
            padding: 10px;
            background: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #219150;
        }

        .error-msg {
            color: red;
            margin-top: 12px;
            font-size: 13px;
            font-weight: bold;
            display: none;
        }

        /* 📱 MAIN APP CONTAINER */
        #main-app {
            display: none;
            flex-direction: column;
            min-height: 98vh;
        }

        .container {
            background: #C4A484;
            padding: 8px 15px;
            min-height: 98vh;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
        }

        /* ⬇️ Header Row for Marquee & Logout */
        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 4px;
        }
        
        .marquee-patti {
            flex-grow: 1;
            background: green;
            color: white;
            padding: 6px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            overflow: hidden;
            white-space: nowrap;
            box-sizing: border-box;
            text-align: center;
        }

        .marquee-patti span {
            display: inline-block;
            padding-left: 100%;
            animation: moveText 15s linear infinite;
        }

        @keyframes moveText {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }

        .btn-logout {
            background-color: #c0392b;
            color: white;
            padding: 6px 10px;
            font-size: 11px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            white-space: nowrap;
        }

        #status-bar {
            width: 100%;
            padding: 4px;
            margin-bottom: 5px;
            font-weight: bold;
            text-align: center;
            border-radius: 3px;
            background-color: #3e2723;
            color: #fff;
            font-size: 12px;
            box-sizing: border-box;
        }
        .btn-container {
            display: flex;
            gap: 6px;
            margin-bottom: 5px;
            justify-content: center;
            flex-wrap: wrap;
        }
        button {
            padding: 6px 12px;
            font-size: 11px;
            font-weight: bold;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            color: white;

        .btn-open { background-color: #8e44ad; }
        .btn-clear-sheet { background-color: #c0392b; }
        .btn-clear-form { background-color: #7f8c8d; }

            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px 8px;
            flex-grow: 1;
            padding: 3px;

        @media (max-width: 1024px) {
            .grid-form {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 600px) {
            .grid-form {
                grid-template-columns: 1fr;
            }
            .header-row {
                flex-direction: column;
                gap: 4px;
            }
            .btn-logout {
                width: 100%;
            }

            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fafafa;
            border: 2px solid #d7ccc8;
            padding: 2px 6px;
            border-radius: 2px;
            box-sizing: border-box;
        }
        label {
            font-size: 11px;
            font-weight: 900; /* Extra Bold */
            color: #1a0dab; /* Dark clear color for readability */
            width: 45%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        input, select {
            width: 52%;
            padding: 2px 4px;
            border: 2px solid black; 
            border-radius: 2px;
            font-size: 13px;
            font-weight: bold; 
            height: 26px;
            box-sizing: border-box;
            background-color: #ffffff;
        }
        input:focus, select:focus {
            border-color: #2980b9;
            background-color: #fffbdf; /* Entry karte samay yellow focus highlight */
            outline: none;
            box-shadow: 0 0 3px rgba(41, 128, 185, 0.5);
        }

            background-color: #e8f4f8;
            font-weight: bold;
            border-color: #27ae60; /* Auto calculation fields ka border green */
        }

            background-color: #3e2723 !important;
            color: #ffeb3b !important;
            font-weight: bold;
            text-align: center;

    </style>
</head>

<!-- 🔒 LOGIN SYSTEM OVERLAY -->
<div id="login-overlay">
    <div class="login-box">
        <h2>GPF System Login</h2>
        <div class="input-group">
            <label>Login ID</label>
            <input type="text" id="loginUser" placeholder="Enter ID (hear)">
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="loginPass" placeholder="Enter Password">
        </div>
        <button class="login-btn" onclick="checkLogin()">Login</button>
        <div class="error-msg" id="loginError">गलत Login ID या Password!</div>
    </div>
</div>

<!-- 📱 MAIN APP FORM CONTAINER -->
<div id="main-app">
    <div class="container">
        <div class="header-row">
            <div class="marquee-patti">
                <span>Data Entry Control Form ( Clean New Version S K I C )</span>
            </div>
            <button class="btn-logout" onclick="logout()">LOGOUT</button>
        </div>
        
        <div id="status-bar">Ready</div>

        <div class="btn-container">
            <button class="btn-save" onclick="btnSave()">SAVE</button>
            <button class="btn-search" onclick="btnSearch()">SEARCH</button>
            <button class="btn-update" onclick="btnUpdate()">UPDATE</button>
            <button class="btn-open" onclick="btnExcelOpen()">GOOGLE SHEET</button>
            <button class="btn-clear-sheet" style="display:none;" onclick="btnClearSheet()">CLEAR SHEET</button>
            <button class="btn-clear-form" onclick="btnClearForm()">CLEAR FORM</button>
        </div>

        <div class="grid-form" id="formFieldsContainer"></div>
    </div>
</div>

    function convertBelowThousand(num) {
        let result = "";
        if (num >= 100) {
            result += hindiWords[Math.floor(num / 100)] + " सौ ";
            num = num % 100;
        }
        if (num > 0) {
            result += hindiWords[num] + " ";
        }
        return result.trim();
    }

    function numberToHindiWords(num) {
        if (num === 0) return "शून्य रुपये मात्र";
        let result = "";

        if (num >= 100000) {
            result += convertBelowThousand(Math.floor(num / 100000)) + " लाख ";
            num = num % 100000;
        }
        if (num >= 1000) {
            result += convertBelowThousand(Math.floor(num / 1000)) + " हजार ";
            num = num % 1000;
        }
        if (num > 0) {
            result += convertBelowThousand(num);
        }
        
        return result.replace(/\s+/g, ' ').trim() + " रुपये मात्र";
    }

    function textBox55_Change(val) {
        document.getElementById('TextBox55').value = val;
        let num = parseInt(val);
        if (!val || isNaN(num)) {
            document.getElementById('TextBox59').value = "";
            return;
        }
        document.getElementById('TextBox59').value = numberToHindiWords(num);
    }

        let v6 = parseFloat(document.getElementById('TextBox6').value) || 0;

    function calculateRetirement() {
        let dobVal = document.getElementById('TextBox25').value;
        let postName = document.getElementById('TextBox4').value.trim();
        if (!dobVal || !postName) return;

        let dob = new Date(dobVal);
        let dayDOB = dob.getDate();
        let monthDOB = dob.getMonth() + 1; 
        let yearDOB = dob.getFullYear();
        let retireDate;

        if (["प्रधानाचार्य", "प्रवक्ता", "स० अ०"].includes(postName)) {
            if (monthDOB === 4 && dayDOB === 1) {
                retireDate = new Date(yearDOB + 62, 2, 31); 
            } else {
                let targetYear = (monthDOB < 4) ? (yearDOB + 62) : (yearDOB + 63);
                retireDate = new Date(targetYear, 2, 31);
            }
        } 
        else if (["प्र० लि०", "स० लि०", "परिचारक", "दफ्तरी", "स्वीपर"].includes(postName)) {
            if (dayDOB === 1) {
                retireDate = new Date(yearDOB + 60, monthDOB - 1, 0); 
            } else {
                retireDate = new Date(yearDOB + 60, monthDOB, 0); 
            }
        } else {
            document.getElementById('TextBox27').value = "Post Not Defined"; 
            return;
        }

        let offset = retireDate.getTimezoneOffset();
        retireDate = new Date(retireDate.getTime() - (offset * 60 * 1000));
        document.getElementById('TextBox27').value = retireDate.toISOString().split('T')[0];
    }

    function runSmartCalc() {
        let box = document.getElementById('TextBox68');
        let str = box.value.trim();
        
        if (/^[0-9.+\-*/()\s]+$/.test(str)) {
            try {
                let result = Function('"use strict"; return (' + str + ')')();
                if (result !== undefined && !isNaN(result) && isFinite(result)) {
                    if (!Number.isInteger(result)) result = parseFloat(result.toFixed(2));
                    
                    showStatus("Calculated: " + result + " (Auto Copied!)", "#FFFFFF");
                    navigator.clipboard.writeText(result);
                }
            } catch (e) {
                showStatus("Calculating...", "white");
            }
        }
    }

    function resetSmartCalc() {
        setTimeout(() => {
            document.getElementById('TextBox68').value = "";
            showStatus("Ready", "white");
        }, 200);
    }

            document.getElementById('TextBox56').value = "भारतीय स्टेट बैंक पडरौना";

    function getLocalData() {
        return JSON.parse(localStorage.getItem('gpf_offline_data')) || [];
    }
    
    function saveLocalData(dataList) {
        localStorage.setItem('gpf_offline_data', JSON.stringify(dataList));
    }

    function btnSave() {
        if(SCRIPT_URL === "YOUR_WEB_APP_URL_HERE") {
            alert("कृपया पहले स्क्रिप्ट यूआरएल (SCRIPT_URL) सेट करें!");
            return;
        }
        
        let nextID = parseInt(document.getElementById('TextBox1').value) || 1;
        let rowData = { action: "save", id: nextID, cells: {} };
        for (let j = 2; j <= 68; j++) { rowData.cells[j] = document.getElementById(`TextBox${j}`).value; }

        if (!navigator.onLine) {
            let localData = getLocalData();
            localData = localData.filter(item => !(item.id === nextID && item.action === "save"));
            localData.push(rowData);
            saveLocalData(localData);
            
            showStatus("Offline Mode: Saved Locally!", "#f39c12");
            setTimeout(() => {
                btnClearForm();
                document.getElementById('TextBox1').value = nextID + 1;
            }, 1500);
            return;
        }

        showStatus("Saving to Google Sheet...", "white");
        fetch(SCRIPT_URL, {
            method: "POST",
            mode: "no-cors", 
            cache: "no-cache",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(rowData)
        })
        .then(() => {
            showStatus("Saved Successfully to Google Sheet!", "#2ecc71");
            clearStatusAfter(2000);
            btnClearForm();
            document.getElementById('TextBox1').value = nextID + 1;
        })
        .catch(error => {
            console.error(error);
            let localData = getLocalData();
            localData.push(rowData);
            saveLocalData(localData);
            showStatus("Net Error! Saved Locally instead.", "#f39c12");
        });
    }

    function btnSearch() {
        let searchID = parseInt(document.getElementById('TextBox1').value) || 0;
        
        let localData = getLocalData();
        let foundLocal = localData.find(item => item.id === searchID);
        
        if (foundLocal) {
            fillFormFields(foundLocal.cells);
            showStatus("Found in Local Storage (Offline Data)!", "#f39c12");
            clearStatusAfter(3000);
            return;
        }

        if (!navigator.onLine) {
            showStatus("Offline! Cannot search Google Sheet right now.", "red");
            return;
        }

        if(SCRIPT_URL === "YOUR_WEB_APP_URL_HERE") { alert("कृपया SCRIPT_URL सेट करें!"); return; }
        showStatus("Searching Google Sheet...", "white");
        
        fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" }, 
            body: JSON.stringify({ action: "search", id: searchID })
        })
        .then(res => res.json())
        .then(response => {
            if (response.status === "success") {
                fillFormFields(response.cells);
                showStatus("Data Found Successfully From Google Sheet!", "#2ecc71");
            } else {
                showStatus("Data Not Found in Google Sheet!", "red");
            }
            clearStatusAfter(2000);
        })
        .catch(error => {
            console.error(error);
            showStatus("Search Error!", "red");
        });
    }

    function fillFormFields(cellsData) {
        for (let j = 2; j <= 68; j++) { 
            let value = cellsData[j] !== undefined ? cellsData[j] : "";
            
            if ([25, 26, 27].includes(j) && value) {
                try {
                    let dateObj = new Date(value);
                    if (!isNaN(dateObj.getTime())) {
                        let yyyy = dateObj.getFullYear();
                        let mm = String(dateObj.getMonth() + 1).padStart(2, '0');
                        let dd = String(dateObj.getDate()).padStart(2, '0');
                        value = `${yyyy}-${mm}-${dd}`; 
                    }
                } catch(e) {
                    console.error("Date formatting error: ", e);
                }
            }
            document.getElementById(`TextBox` + j).value = value; 
        }
    }

    function btnUpdate() {
        if(SCRIPT_URL === "YOUR_WEB_APP_URL_HERE") { alert("कृपया SCRIPT_URL सेट करें!"); return; }
        
        let updateID = parseInt(document.getElementById('TextBox1').value) || 0;
        let rowData = { action: "update", id: updateID, cells: {} };
        for (let j = 2; j <= 68; j++) { rowData.cells[j] = document.getElementById(`TextBox${j}`).value; }

        if (!navigator.onLine) {
            let localData = getLocalData();
            localData = localData.filter(item => item.id !== updateID);
            localData.push(rowData);
            saveLocalData(localData);
            showStatus("Offline Mode: Update Saved Locally!", "#f39c12");
            clearStatusAfter(3000);
            return;
        }

        showStatus("Updating Sheet...", "white");
        fetch(SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify(rowData)
        })
        .then(res => res.json())
        .then(response => {
            if(response.status === "success") {
                showStatus("Data Updated Successfully!", "#2ecc71");
            } else {
                showStatus("Data ID Not Found to Update!", "red");
            }
            clearStatusAfter(2000);
        })
        .catch(error => {
            console.error(error);
            let localData = getLocalData();
            localData = localData.filter(item => item.id !== updateID);
            localData.push(rowData);
            saveLocalData(localData);
            showStatus("Update Error! Saved Locally.", "#f39c12");
        });
    }

    window.addEventListener('online', () => {
        let localData = getLocalData();
        if (localData.length === 0) return;

        showStatus("Internet Restored! Syncing data with Google Sheet...", "#3498db");

        let promises = localData.map(rowData => {
            return fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                cache: "no-cache",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(rowData)
            }).then(() => rowData.id);
        });

        Promise.all(promises)
        .then((syncedIds) => {
            let currentLocal = getLocalData();
            let remainingLocal = currentLocal.filter(item => !syncedIds.includes(item.id));
            saveLocalData(remainingLocal);

            showStatus("All Offline Data Synced Successfully!", "#2ecc71");
            clearStatusAfter(3000);
        })
        .catch(err => {
            console.error("Syncing Error: ", err);
            showStatus("Some data failed to sync. Will retry later.", "red");
        });
    });

    function btnExcelOpen() {
        const GOOGLE_SHEET_URL = "https://docs.google.com/spreadsheets/d/YOUR_SPREADSHEET_ID_HERE/edit";
        
        if (GOOGLE_SHEET_URL.includes("YOUR_SPREADSHEET_ID_HERE")) {
            window.open("https://docs.google.com/spreadsheets", '_blank');
        } else {
            window.open(GOOGLE_SHEET_URL, '_blank');
        }
        
        showStatus("Google Sheet Opened!", "#2ecc71");
        clearStatusAfter(2000);
    }

        manualEdit = false;
        for (let i = 2; i <= 68; i++) { document.getElementById(`TextBox${i}`).value = ""; }
        document.getElementById('TextBox1').value = "";
