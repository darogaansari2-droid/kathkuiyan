<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Admission Portal</title>
    <style id="dynamicStyles">
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 5px; }
        .main-wrapper { max-width: 1200px; margin: auto; }
        .fixed-header { background: white; padding:14px; border: 2px solid #333; position: sticky; top: 0; z-index: 100; }
        .form-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 10px; }
        input, select { width: 100%; padding: 13px 10px; border: 1px solid #999; box-sizing: border-box; font-size: 13px; }
        label { font-size: 11px; font-weight: bold; display: block; }
        button { padding: 5px 10px; cursor: pointer; border: none; background: #2c3e50; color: white; font-size: 13px; }
        .total-box { background: #2c3e50; color: white; padding: 2px 10px; border-radius: 15px; display: inline-block; font-weight: bold; margin: 5px 0; font-size: 13px; }
        .scroll-area { margin-top: 16px; background: white; padding: 10px; border: 1px solid #333; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { border: 1px solid #000; padding: 4px 6px; text-align: left; }
        
        .del-btn { background: #e74c3c; display: none; }
        .edit-btn { background: #f39c12; }
        .clear-single-btn { background: #d35400; font-size: 11px; padding: 3px 6px; }
        .search-container { display: flex; gap: 10px; margin-bottom: 5px; }
        .search-container input, .search-container select { padding: 8px; border: 2px solid #2c3e50; font-size: 13px; }
        
        /* Login Page & Modal Styles */
        #loginOverlay, .custom-modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .login-box, .modal-box {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 300px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.5);
        }
        .login-box h3, .modal-box h3 { margin-top: 0; text-align: center; color: #2c3e50; }
        .login-box label, .modal-box label { margin-top: 10px; }
        .login-box input, .modal-box input { margin-bottom: 12px; }
        .login-box button, .modal-box button { width: 100%; background: #27ae60; padding: 10px; font-weight: bold; }
        .error-msg { color: red; font-size: 12px; text-align: center; margin-top: 5px; display: none; }
    </style>
</head>
<body>

<!-- Login Screen -->
<div id="loginOverlay">
    <div class="login-box">
        <h3>Portal Login</h3>
        <label>Login ID:</label>
        <input type="text" id="loginId" placeholder="Enter ID">
        <label>Password:</label>
        <input type="password" id="loginPass" placeholder="Enter Password">
        <button onclick="checkLogin()">Login</button>
        <div id="errorMsg" class="error-msg">Galat Login ID ya Password!</div>
    </div>
</div>

<!-- Hidden Security Password Modal -->
<div id="passModalOverlay" class="custom-modal-overlay" style="display: none;">
    <div class="modal-box">
        <h3 id="modalTitle">Enter Security Password</h3>
        <label>Password:</label>
        <input type="password" id="securityPassInput" placeholder="****" onkeyup="handlePassEnter(event)">
        <button onclick="submitSecurityPass()">Confirm</button>
        <button onclick="closePassModal()" style="background:#7f8c8d; margin-top: 5px;">Cancel</button>
        <div id="passErrorMsg" class="error-msg">Galat Password!</div>
    </div>
</div>

<div class="main-wrapper" id="portalContent" style="display: none;">
    <div class="fixed-header">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="margin: 0;">Admission Entry Portal From 2026-27................</h3>
            <button onclick="logout()" style="background:#e74c3c; font-size: 12px; padding: 6px 12px;">Logout</button>
        </div>
        <input type="hidden" id="editIndex">
        <div class="form-grid" style="margin-top: 10px;">
            <div><label>Start SR:</label><input type="number" id="startSr" oninput="calculateEndSr()"></div>
            <div><label>Sankhya:</label><input type="number" id="countBox" oninput="calculateEndSr()"></div>
            <div><label>End SR:</label><input type="number" id="endSr" readonly></div>
            <div><label>Teacher:</label><input type="text" id="teacher"></div>
            <div><label>Class:</label><input type="text" id="classSec"></div>
            <div><label>Date:</label><input type="text" id="entryDate" placeholder="DD/MM/YYYY"></div>
        </div>
        <button onclick="saveData()" style="background:#27ae60;">Save / Update</button>
        <button onclick="resetForm()" style="background:#6c757d;">Reset</button>
        <button onclick="promptForAction('unlock')" style="background:#8e44ad;">Unlock Delete</button>
        <button onclick="promptForAction('clearAllLocal')" style="background:#d35400;">Clear All Local</button>
    </div>

    <div class="scroll-area">
        <div class="search-container">
            <input type="text" id="searchBox" placeholder="🔍 Search Teacher Name..." onkeyup="handleSearch()" style="flex: 2;">
            <input type="text" id="searchClassBox" placeholder="🔍 Filter Class (e.g. 6A, 6B)..." onkeyup="handleSearch()" style="flex: 1;">
            <button onclick="searchSheetData()" style="background:#2980b9; font-size:12px; padding: 8px 12px;">Search Sheet</button>
        </div>
        <div class="total-box">Total SR Issued (Filtered): <span id="liveTotalSr">0</span></div>
        <table id="dataTable">
            <thead>
                <tr>
                    <th>Range</th>
                    <th>Teacher</th>
                    <th>Class</th>
                    <th>Sankhya</th>
                    <th>Date</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxg61wczAeGNd3H4hcVIPcP8J4ovb4gsfMWjgD-cAk6JdS1aAbKZscdEHBicAPZeST9/exec";
    let data = JSON.parse(localStorage.getItem('admissions')) || [];
    let currentActionTarget = "";
    let isDeleteUnlocked = false;

    if(sessionStorage.getItem('isLoggedIn') === 'true') {
        document.getElementById('loginOverlay').style.display = 'none';
        document.getElementById('portalContent').style.display = 'block';
    }

    function checkLogin() {
        let id = document.getElementById('loginId').value.trim();
        let pass = document.getElementById('loginPass').value.trim();

        if(id === "scollar" && pass === "123") {
            sessionStorage.setItem('isLoggedIn', 'true');
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('portalContent').style.display = 'block';
            updateNextSr();
            render();
        } else {
            document.getElementById('errorMsg').style.display = 'block';
        }
    }

    function logout() {
        sessionStorage.removeItem('isLoggedIn');
        document.getElementById('loginOverlay').style.display = 'flex';
        document.getElementById('portalContent').style.display = 'none';
        document.getElementById('loginId').value = "";
        document.getElementById('loginPass').value = "";
        document.getElementById('errorMsg').style.display = 'none';
    }

    function updateNextSr() {
        if(data.length > 0) {
            let lastEndSr = Math.max(...data.map(i => parseInt(i.end) || 0));
            if (lastEndSr > 0) {
                document.getElementById('startSr').value = lastEndSr + 1;
            }
        } else {
            document.getElementById('startSr').value = "";
        }
    }

    function calculateEndSr() {
        let s = parseInt(document.getElementById('startSr').value) || 0;
        let c = parseInt(document.getElementById('countBox').value) || 0;
        if (s > 0 && c > 0) document.getElementById('endSr').value = s + c - 1;
    }

    function formatDate(dateStr) {
        if (!dateStr) return "";
        let str = String(dateStr).trim();
        
        if (str.includes('/')) {
            let parts = str.split('/');
            if (parts.length === 3) {
                let day = parts[0].padStart(2, '0');
                let month = parts[1].padStart(2, '0');
                let year = parts[2].split('T')[0].trim();
                return `${day}/${month}/${year}`;
            }
        }

        if (str.includes('-')) {
            let parts = str.split('-');
            if (parts.length === 3) {
                let year = parts[0].trim();
                let month = parts[1].padStart(2, '0');
                let day = parts[2].split('T')[0].padStart(2, '0');
                return `${day}/${month}/${year}`;
            }
        }

        return str;
    }

    function resetForm() {
        document.getElementById('editIndex').value = "";
        document.getElementById('startSr').value = "";
        document.getElementById('countBox').value = "";
        document.getElementById('endSr').value = "";
        document.getElementById('teacher').value = "";
        document.getElementById('classSec').value = "";
        document.getElementById('entryDate').value = "";
        document.getElementById('startSr').readOnly = false;
        updateNextSr();
    }

    function saveData() {
        let startVal = document.getElementById('startSr').value;
        let teacherVal = document.getElementById('teacher').value;

        if(!startVal || !teacherVal) {
            alert("Kripya Start SR aur Teacher Name zaroor bharein!");
            return;
        }

        let rawDate = document.getElementById('entryDate').value;
        let finalFormattedDate = formatDate(rawDate);

        let entry = {
            start: startVal,
            count: document.getElementById('countBox').value,
            end: document.getElementById('endSr').value,
            teacher: teacherVal,
            classSec: document.getElementById('classSec').value,
            date: finalFormattedDate
        };

        let index = document.getElementById('editIndex').value;
        
        // Match existing entry by Start SR
        let existingIndex = data.findIndex(item => String(item.start).trim() === String(startVal).trim());

        if(index !== "") {
            data[index] = entry;
        } else if(existingIndex !== -1) {
            data[existingIndex] = entry;
        } else {
            data.push(entry); 
        }
        
        localStorage.setItem('admissions', JSON.stringify(data));
        syncToSheet(entry);
        resetForm();
        render();
    }

    function syncToSheet(entry) {
        if (navigator.onLine) {
            fetch(SCRIPT_URL, { 
                method: 'POST', 
                mode: 'no-cors', 
                body: JSON.stringify(entry) 
            }).then(() => {
                console.log("Data Sheet me sync/update ho gaya!");
            }).catch(err => console.error("Sync Error:", err));
        } else {
            let pending = JSON.parse(localStorage.getItem('pendingSync')) || [];
            pending.push(entry);
            localStorage.setItem('pendingSync', JSON.stringify(pending));
            alert("Offline mode: Local memory update ho gayi hai.");
        }
    }

    function handleSearch() {
        render();
    }

    function searchSheetData() {
        let qTeacher = document.getElementById('searchBox').value.trim().toLowerCase();
        let qClass = document.getElementById('searchClassBox').value.trim().toLowerCase();

        if (!qTeacher && !qClass) {
            alert("Kripya Search Name ya Class likhein!");
            return;
        }

        let searchQuery = qTeacher || qClass;

        fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: "search", query: searchQuery })
        })
        .then(response => response.json())
        .then(sheetResults => {
            if (sheetResults && sheetResults.length > 0) {
                renderList(sheetResults, true);
            } else {
                alert("Google Sheet me record nahi mila!");
            }
        })
        .catch(error => {
            console.error("Error searching sheet:", error);
            alert("Sheet se search me dikkat aayi.");
        });
    }

    function renderList(listData, isSheetResult = false) {
        let qTeacher = document.getElementById('searchBox').value.toLowerCase();
        let qClass = document.getElementById('searchClassBox').value.toLowerCase();
        let tbody = document.querySelector('#dataTable tbody');
        tbody.innerHTML = '';
        let total = 0;

        listData.forEach((item, i) => {
            let matchTeacher = (item.teacher || "").toLowerCase().includes(qTeacher);
            let matchClass = (item.classSec || "").toLowerCase().includes(qClass);

            if(matchTeacher && matchClass) {
                let formattedDate = formatDate(item.date);
                let delDisplayStyle = isDeleteUnlocked ? 'inline-block' : 'none';
                
                let localClearBtn = (!isSheetResult) 
                    ? `<button class="clear-single-btn" onclick="clearSingleLocal(${i})">Remove Local</button>` 
                    : '';

                tbody.innerHTML += `<tr>
                    <td>${item.start}-${item.end}</td>
                    <td>${item.teacher}</td>
                    <td>${item.classSec}</td>
                    <td>${item.count}</td>
                    <td>${formattedDate}</td>
                    <td>
                        <button class="edit-btn" onclick='editItem(${JSON.stringify(item)})'>Edit</button> 
                        ${localClearBtn}
                        <button class="del-btn" style="display:${delDisplayStyle}" onclick="del('${item.start}')">Delete Sheet</button>
                    </td>
                </tr>`;
                total += parseInt(item.count || 0);
            }
        });
        document.getElementById('liveTotalSr').innerText = total;
    }

    function render() {
        renderList(data, false);
    }

    function editItem(item) {
        let index = data.findIndex(d => String(d.start).trim() === String(item.start).trim());
        document.getElementById('editIndex').value = (index !== -1) ? index : "";
        document.getElementById('startSr').value = item.start;
        document.getElementById('startSr').readOnly = true; // Unique ID lock
        document.getElementById('countBox').value = item.count;
        document.getElementById('endSr').value = item.end;
        document.getElementById('teacher').value = item.teacher;
        document.getElementById('classSec').value = item.classSec;
        document.getElementById('entryDate').value = formatDate(item.date);
    }

    // SIRF WAHI WALI ROW LOCAL STORAGE SE KHALI KARNA
    function clearSingleLocal(i) {
        if(confirm("Kya aap is entry ko sirf Local Storage se hatana chahte hain? (Google Sheet ka data safe rahega)")) {
            data.splice(i, 1);
            localStorage.setItem('admissions', JSON.stringify(data));
            render();
            updateNextSr();
            alert("Entry Local Storage se saaf ho gayi!");
        }
    }

    function promptForAction(actionType) {
        currentActionTarget = actionType;
        document.getElementById('securityPassInput').value = "";
        document.getElementById('passErrorMsg').style.display = "none";
        
        if(actionType === 'unlock') {
            document.getElementById('modalTitle').innerText = "Unlock Delete Password";
        } else if(actionType === 'clearAllLocal') {
            document.getElementById('modalTitle').innerText = "Clear All Local Data Password";
        }
        
        document.getElementById('passModalOverlay').style.display = "flex";
        setTimeout(() => {
            document.getElementById('securityPassInput').focus();
        }, 100);
    }

    function closePassModal() {
        document.getElementById('passModalOverlay').style.display = "none";
        currentActionTarget = "";
    }

    function handlePassEnter(e) {
        if(e.key === 'Enter') {
            submitSecurityPass();
        }
    }

    function submitSecurityPass() {
        let pass = document.getElementById('securityPassInput').value.trim();
        
        if(pass === "1234") {
            let target = currentActionTarget;
            closePassModal();
            
            if(target === 'unlock') {
                isDeleteUnlocked = true;
                document.querySelectorAll('.del-btn').forEach(b => b.style.display = 'inline-block');
                alert("Delete Buttons Unlocked!");
            } else if(target === 'clearAllLocal') {
                clearAllLocalStorage();
            }
        } else {
            document.getElementById('passErrorMsg').style.display = "block";
        }
    }

    function del(startSr) {
        if(confirm("Kya aap Google Sheet se yeh row bilkul delete karna chahte hain?")) {
            // Local se bhi remove karein
            data = data.filter(item => String(item.start).trim() !== String(startSr).trim());
            localStorage.setItem('admissions', JSON.stringify(data)); 
            
            if (navigator.onLine) {
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    body: JSON.stringify({ action: "delete", start: startSr })
                });
            }

            render(); 
            updateNextSr(); 
        }
    }

    function clearAllLocalStorage() {
        if(confirm("Kya aap SABHI local data clear karna chahte hain? (Google Sheet ka data delete NAHI hoga)")) {
            localStorage.removeItem('admissions');
            localStorage.removeItem('pendingSync');
            data = []; 
            render();
            resetForm();
            alert("Sari Local entries khali ho gayi hain!");
        }
    }

    if(sessionStorage.getItem('isLoggedIn') === 'true') {
        updateNextSr();
        render();
    }
</script>
</body>
</html>
