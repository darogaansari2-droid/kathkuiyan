<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>विद्यालय लेखा-जोखा पंजिका</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: #f4f6f9; color: #1a202c; padding: 15px; font-size: 13px; }
    
    /* हेडर एवं टूलबार */
    .header-box { background: #1e3a8a; color: #fff; padding: 14px 20px; border-radius: 6px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
    .header-box h1 { font-size: 19px; letter-spacing: 0.3px; }
    .header-meta { font-size: 12.5px; opacity: 0.92; margin-top: 3px; }
    
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 15px; }
    .btn { padding: 8px 14px; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px; transition: 0.2s; height: 36px; }
    .btn-primary { background: #15803d; color: #fff; }
    .btn-primary:hover { background: #166534; }
    .btn-break { background: #b45309; color: #fff; }
    .btn-break:hover { background: #92400e; }
    .btn-bank { background: #0369a1; color: #fff; }
    .btn-bank:hover { background: #075985; }
    .btn-settings { background: #475569; color: #fff; }
    .btn-settings:hover { background: #334155; }
    .btn-print { background: #1e293b; color: #fff; }
    .btn-print:hover { background: #0f172a; }
    .btn-reset { background: #dc2626; color: #fff; }

    /* कैलकुलेटर विजेट (टूलबार के आकार में) */
    .calc-box { display: inline-flex; align-items: center; background: #fff; border: 1px solid #cbd5e1; border-radius: 4px; height: 36px; padding: 0 6px; gap: 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .calc-input { width: 140px; height: 26px; border: 1px solid #cbd5e1; border-radius: 3px; text-align: right; padding: 0 6px; font-size: 13px; font-weight: 600; }
    .calc-btn { background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 3px; width: 26px; height: 26px; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 12px; }
    .calc-btn:hover { background: #e2e8f0; }
    .calc-btn-eq { background: #1e3a8a; color: #fff; border-color: #1e3a8a; }
    .calc-btn-eq:hover { background: #1e40af; }
    
    /* पंजिका पेज कार्ड */
    .register-page { background: #fff; border: 1px solid #cbd5e1; border-radius: 6px; padding: 14px; margin-bottom: 24px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); overflow-x: auto; }
    .page-title-bar { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1e3a8a; padding-bottom: 6px; margin-bottom: 10px; font-weight: bold; color: #1e3a8a; font-size: 14px; }
    
    /* मुख्य पंजिका तालिका */
    table.ledger { width: 100%; border-collapse: collapse; min-width: 1120px; font-size: 12px; }
    table.ledger th, table.ledger td { border: 1px solid #64748b; padding: 5px 4px; text-align: center; vertical-align: middle; }
    table.ledger thead th { background: #e2e8f0; color: #0f172a; font-weight: 700; }
    .side-left-hdr { background: #dbeafe !important; color: #1e3a8a !important; font-size: 13px; }
    .side-right-hdr { background: #fef3c7 !important; color: #92400e !important; font-size: 13px; }
    
    .text-left { text-align: left !important; padding-left: 5px !important; }
    .desc-col { width: 115px; max-width: 115px; word-wrap: break-word; line-height: 1.25; }
    .num { text-align: right !important; padding-right: 5px !important; font-variant-numeric: tabular-nums; }
    .paise { width: 25px; text-align: center !important; color: #334155; }
    .rupee { min-width: 48px; }
    
    /* विशेष पंक्तियाँ */
    .row-opening { background: #f8fafc; font-weight: 600; color: #334155; }
    .row-page-total { background: #f1f5f9; font-weight: 700; border-top: 2px solid #334155 !important; }
    .row-grand-tally { background: #ecfdf5; font-weight: 800; color: #065f46; border-top: 2px solid #059669 !important; border-bottom: 2px solid #059669 !important; font-size: 12.5px; }
    .tally-badge { display: inline-block; background: #059669; color: #fff; padding: 2px 7px; border-radius: 3px; font-size: 11px; margin-left: 5px; }
    
    /* एक्शन बटन (Edit / Delete) */
    .action-cell { white-space: nowrap; width: 48px; }
    .edit-btn { background: none; border: none; color: #0369a1; cursor: pointer; font-weight: bold; font-size: 13px; padding: 1px 3px; }
    .edit-btn:hover { color: #1e3a8a; }
    .del-btn { background: none; border: none; color: #dc2626; cursor: pointer; font-weight: bold; font-size: 14px; padding: 1px 3px; }
    .del-btn:hover { color: #991b1b; }
    
    /* डायनामिक मोडल स्टाइल */
    .modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.65); display: flex; align-items: center; justify-content: center; z-index: 9999; padding: 15px; }
    .modal-box { background: #fff; border-radius: 8px; width: 100%; max-width: 650px; max-height: 90vh; overflow-y: auto; padding: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.25); }
    .modal-box.wide { max-width: 900px; }
    .modal-hdr { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 14px; font-size: 16px; font-weight: 700; color: #1e3a8a; }
    .close-modal { background: none; border: none; font-size: 22px; cursor: pointer; color: #64748b; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 12px; font-weight: 600; color: #334155; }
    .form-group input, .form-group select { padding: 7px 9px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px; }
    .info-strip { background: #eff6ff; border-left: 4px solid #2563eb; padding: 8px 12px; font-size: 12px; margin-bottom: 12px; color: #1e40af; }

    @media print {
      .toolbar, .action-col { display: none !important; }
      body { background: #fff; padding: 0; }
      .register-page { box-shadow: none; border: none; page-break-after: always; padding: 5px; }
    }
  </style>
</head>
<body>

  <div class="header-box">
    <div>
      <h1 id="dispSchoolName">राजकीय उच्चतर माध्यमिक विद्यालय — लेखा-जोखा पंजिका</h1>
      <div class="header-meta" id="dispSchoolMeta">शैक्षणिक सत्र: 2026-27 | बैंक खाता सं.: SBI-30984512789</div>
    </div>
    <div style="text-align:right; font-size:12.5px;">
      <div>वर्तमान बैंक शेष: <strong id="topBankBal">₹ 0.00</strong></div>
      <div>वर्तमान तिजोरी शेष: <strong id="topCashBal">₹ 0.00</strong></div>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn btn-primary" onclick="openEntryModal()">+ नई प्रविष्टि जोड़ें</button>
    <button class="btn btn-break" onclick="addParaBreak()">✂ पैरा ब्रेक (नया पेज)</button>
    <button class="btn btn-bank" onclick="openPassbookModal()">📒 पासबुक मिलान</button>
    <button class="btn btn-settings" onclick="openSettingsModal()">⚙️ सेटिंग्स</button>
    <button class="btn btn-print" onclick="window.print()">🖨️ प्रिंट</button>
    <button class="btn btn-reset" onclick="resetAllData()">रीसेट</button>

    <!-- कैलकुलेटर विजेट -->
    <div class="calc-box" title="त्वरित कैलकुलेटर">
      <input type="text" id="calcInput" class="calc-input" placeholder="0" onkeydown="if(event.key==='Enter') calcCompute()">
      <button class="calc-btn" onclick="calcAppend('+')" title="जोड़">+</button>
      <button class="calc-btn" onclick="calcAppend('-')" title="घटाव">-</button>
      <button class="calc-btn" onclick="calcAppend('*')" title="गुणा">×</button>
      <button class="calc-btn" onclick="calcAppend('/')" title="भाग">÷</button>
      <button class="calc-btn calc-btn-eq" onclick="calcCompute()" title="बराबर">=</button>
      <button class="calc-btn" onclick="calcClear()" title="साफ़ करें" style="color:#dc2626;">C</button>
    </div>
  </div>

  <!-- मुख्य पंजिका तालिका कंटेनर -->
  <div id="registerPagesContainer"></div>

  <script>
    const STORAGE_KEY = 'vidyalay_panjika_permanent_v3';

    const defaultState = {
      schoolName: 'राजकीय उच्चतर माध्यमिक विद्यालय — लेखा-जोखा पंजिका',
      session: '2026-27',
      accountNo: 'SBI-30984512789',
      openingDate: '2026-04-01',
      openingBank: 12000.00,
      openingCash: 0.00,
      entries: [
        { id: 1, type: 'fee', date: '2026-04-06', desc: 'मासिक फ़ीस जमा (किस्त 1/4)', feeBase: 1000, reAdm: 0, fileFee: 0, lateFee: 0, daFee: 0, amount: 1000, voucher: '', mode: 'cash' },
        { id: 2, type: 'bank_deposit', date: '2026-04-10', desc: '', amount: 1000, voucher: 'तिजोरी से बैंक खाता में जमा', mode: 'transfer' },
        { id: 3, type: 'govt_challan', date: '2026-04-18', desc: '', amount: 400, voucher: 'सरकारी फ़ीस चालान सं. 01 जमा', mode: 'bank' },
        { id: 4, type: 'interest', date: '2026-06-30', desc: 'बैंक बचत खाते का त्रैमासिक ब्याज', amount: 150.50, voucher: '', mode: 'bank' }
      ],
      pageBreaks: []
    };

    let state = JSON.parse(JSON.stringify(defaultState));

    function loadState() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          if (parsed && Array.isArray(parsed.entries)) {
            state = parsed;
            if (!state.openingDate) state.openingDate = '2026-04-01';
          }
        } catch(e) {}
      } else {
        saveState();
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    /* कैलकुलेटर फ़ंक्शन */
    function calcAppend(val) {
      const inp = document.getElementById('calcInput');
      inp.value += val;
    }
    function calcClear() {
      document.getElementById('calcInput').value = '';
    }
    function calcCompute() {
      const inp = document.getElementById('calcInput');
      try {
        let res = Function('return ' + inp.value)();
        if (res === undefined || isNaN(res)) res = 'Error';
        inp.value = res;
      } catch(e) {
        inp.value = 'Error';
      }
    }

    function splitRP(val) {
      const n = Math.round((Number(val) || 0) * 100);
      const r = Math.floor(n / 100);
      const p = String(n % 100).padStart(2, '0');
      return { r: r.toLocaleString('en-IN'), p };
    }

    function fmtMoney(val) {
      return '₹ ' + (Number(val) || 0).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function fmtDate(d) {
      if (!d) return '';
      const parts = d.split('-');
      return parts.length === 3 ? `${parts[2]}-${parts[1]}-${parts[0]}` : d;
    }

    function renderLedger() {
      document.getElementById('dispSchoolName').textContent = state.schoolName;
      document.getElementById('dispSchoolMeta').textContent = `शैक्षणिक सत्र: ${state.session} | बैंक खाता सं.: ${state.accountNo}`;

      const container = document.getElementById('registerPagesContainer');
      container.innerHTML = '';

      let pages = [];
      let currentChunk = [];
      state.entries.forEach(entry => {
        currentChunk.push(entry);
        if (state.pageBreaks.includes(entry.id)) {
          pages.push(currentChunk);
          currentChunk = [];
        }
      });
      pages.push(currentChunk);

      let runningBank = Number(state.openingBank) || 0;
      let runningCash = Number(state.openingCash) || 0;
      const opDateFormatted = fmtDate(state.openingDate || '2026-04-01');

      pages.forEach((chunk, pageIdx) => {
        const pageOpenBank = runningBank;
        const pageOpenCash = runningCash;
        const pageOpenTotal = pageOpenBank + pageOpenCash;

        let sumReAdm = 0, sumFile = 0, sumLate = 0, sumDa = 0;
        let sumReceived = 0;
        let sumGiven = 0;

        let rowsHtml = '';
        const opTotRP = splitRP(pageOpenTotal);
        const opBankRP = splitRP(pageOpenBank);
        const opCashRP = splitRP(pageOpenCash);

        rowsHtml += `
          <tr class="row-opening">
            <td>${opDateFormatted}</td>
            <td class="text-left desc-col"><strong>प्रारंभिक अवशेष (Opening Balance)</strong></td>
            <td>—</td><td>—</td><td>—</td><td>—</td>
            <td class="num rupee">0</td><td class="paise">00</td>
            <td class="num rupee">${opTotRP.r}</td><td class="paise">${opTotRP.p}</td>
            <td class="num rupee">${opTotRP.r}</td><td class="paise">${opTotRP.p}</td>
            <td>—</td>
            <td class="text-left desc-col"></td>
            <td class="num rupee">0</td><td class="paise">00</td>
            <td class="num rupee">${opTotRP.r}</td><td class="paise">${opTotRP.p}</td>
            <td class="num rupee">${opBankRP.r}</td><td class="paise">${opBankRP.p}</td>
            <td class="num rupee">${opCashRP.r}</td><td class="paise">${opCashRP.p}</td>
            <td class="action-col">—</td>
          </tr>
        `;

        chunk.forEach(e => {
          const prevTotal = runningBank + runningCash;
          let recToday = 0;
          let givenToday = 0;
          let leftDesc = '';
          let rightVoucher = '';

          if (e.type === 'fee') {
            recToday = Number(e.amount) || 0;
            leftDesc = e.desc || '';
            runningCash += recToday;
            sumReAdm += Number(e.reAdm) || 0;
            sumFile += Number(e.fileFee) || 0;
            sumLate += Number(e.lateFee) || 0;
            sumDa += Number(e.daFee) || 0;
          } else if (e.type === 'interest') {
            recToday = Number(e.amount) || 0;
            leftDesc = e.desc || '';
            runningBank += recToday;
          } else if (e.type === 'bank_deposit') {
            const amt = Number(e.amount) || 0;
            rightVoucher = e.voucher || e.desc || 'तिजोरी से बैंक खाता में जमा';
            runningCash -= amt;
            runningBank += amt;
          } else if (e.type === 'expense' || e.type === 'govt_challan') {
            givenToday = Number(e.amount) || 0;
            rightVoucher = e.voucher || '';
            if (e.mode === 'bank') runningBank -= givenToday;
            else runningCash -= givenToday;
          }

          sumReceived += recToday;
          sumGiven += givenToday;

          const rowTotalLeft = prevTotal + recToday;
          const closingTotal = runningBank + runningCash;

          const recRP = splitRP(recToday);
          const prevRP = splitRP(prevTotal);
          const totLeftRP = splitRP(rowTotalLeft);
          const givRP = splitRP(givenToday);
          const remRP = splitRP(closingTotal);
          const bnkRP = splitRP(runningBank);
          const cshRP = splitRP(runningCash);

          rowsHtml += `
            <tr>
              <td>${fmtDate(e.date)}</td>
              <td class="text-left desc-col">${leftDesc}</td>
              <td>${e.reAdm ? e.reAdm : '—'}</td>
              <td>${e.fileFee ? e.fileFee : '—'}</td>
              <td>${e.lateFee ? e.lateFee : '—'}</td>
              <td>${e.daFee ? e.daFee : '—'}</td>
              <td class="num rupee">${recRP.r}</td><td class="paise">${recRP.p}</td>
              <td class="num rupee">${prevRP.r}</td><td class="paise">${prevRP.p}</td>
              <td class="num rupee"><strong>${totLeftRP.r}</strong></td><td class="paise">${totLeftRP.p}</td>
              <td>${(givenToday > 0 || e.type === 'bank_deposit') ? fmtDate(e.date) : '—'}</td>
              <td class="text-left desc-col">${rightVoucher}</td>
              <td class="num rupee">${givRP.r}</td><td class="paise">${givRP.p}</td>
              <td class="num rupee"><strong>${remRP.r}</strong></td><td class="paise">${remRP.p}</td>
              <td class="num rupee">${bnkRP.r}</td><td class="paise">${bnkRP.p}</td>
              <td class="num rupee">${cshRP.r}</td><td class="paise">${cshRP.p}</td>
              <td class="action-cell action-col">
                <button class="edit-btn" title="संपादित करें (Edit)" onclick="openEntryModal(${e.id})">✎</button>
                <button class="del-btn" title="हटाएं (Delete)" onclick="deleteEntry(${e.id})">×</button>
              </td>
            </tr>
          `;
        });

        const sRecRP = splitRP(sumReceived);
        const sOpRP = splitRP(pageOpenTotal);
        const leftGrandTotal = pageOpenTotal + sumReceived;
        const sLeftGrandRP = splitRP(leftGrandTotal);

        const sGivRP = splitRP(sumGiven);
        const endTotal = runningBank + runningCash;
        const sEndRP = splitRP(endTotal);
        const sEndBankRP = splitRP(runningBank);
        const sEndCashRP = splitRP(runningCash);
        const rightGrandTotal = sumGiven + endTotal;
        const sRightGrandRP = splitRP(rightGrandTotal);

        const isTallied = Math.abs(leftGrandTotal - rightGrandTotal) < 0.01;

        rowsHtml += `
          <tr class="row-page-total">
            <td colspan="2" class="text-left">पृष्ठ ${pageIdx + 1} का दैनिक लेन-देन एवं अवशेष योग:</td>
            <td>${sumReAdm || 0}</td>
            <td>${sumFile || 0}</td>
            <td>${sumLate || 0}</td>
            <td>${sumDa || 0}</td>
            <td class="num rupee">${sRecRP.r}</td><td class="paise">${sRecRP.p}</td>
            <td class="num rupee">${sOpRP.r}</td><td class="paise">${sOpRP.p}</td>
            <td class="num rupee">${sLeftGrandRP.r}</td><td class="paise">${sLeftGrandRP.p}</td>
            <td colspan="2" class="text-left">कुल दिया गया (व्यय/चालान) एवं अंतिम शेष:</td>
            <td class="num rupee">${sGivRP.r}</td><td class="paise">${sGivRP.p}</td>
            <td class="num rupee">${sEndRP.r}</td><td class="paise">${sEndRP.p}</td>
            <td class="num rupee">${sEndBankRP.r}</td><td class="paise">${sEndBankRP.p}</td>
            <td class="num rupee">${sEndCashRP.r}</td><td class="paise">${sEndCashRP.p}</td>
            <td class="action-col">—</td>
          </tr>
          <tr class="row-grand-tally">
            <td colspan="10" class="text-left">
              बायाँ पक्ष महायोग (पिछला रोकड़ ${fmtMoney(pageOpenTotal)} + कुल प्राप्त धन ${fmtMoney(sumReceived)}) =
            </td>
            <td class="num rupee">${sLeftGrandRP.r}</td><td class="paise">${sLeftGrandRP.p}</td>
            <td colspan="4" class="text-left">
              दायाँ पक्ष महायोग (दिया गया/चालान ${fmtMoney(sumGiven)} + अंतिम शेष ${fmtMoney(endTotal)}) =
            </td>
            <td class="num rupee">${sRightGrandRP.r}</td><td class="paise">${sRightGrandRP.p}</td>
            <td colspan="5" class="text-left">
              ${isTallied ? '<span class="tally-badge">✓ दोनों पक्ष बराबर (TALLY OK)</span>' : '⚠️ अंतर'}
            </td>
          </tr>
        `;

        const pageDiv = document.createElement('div');
        pageDiv.className = 'register-page';
        pageDiv.innerHTML = `
          <div class="page-title-bar">
            <span>पृष्ठ संख्या: ${pageIdx + 1} ${pageIdx < pages.length - 1 ? '(पैरा ब्रेक द्वारा समाप्त — शेष अगले पृष्ठ पर)' : '(वर्तमान चालू पृष्ठ)'}</span>
            <span>प्रारंभिक अवशेष दिनांक: ${opDateFormatted} | अंतिम शेष: ${fmtMoney(endTotal)}</span>
          </div>
          <table class="ledger">
            <thead>
              <tr>
                <th colspan="12" class="side-left-hdr">प्राप्ति पक्ष (RECEIPTS SIDE)</th>
                <th colspan="11" class="side-right-hdr">भुगतान एवं शेष पक्ष (PAYMENTS & BALANCE SIDE)</th>
              </tr>
              <tr>
                <th rowspan="2">दिनांक</th>
                <th rowspan="2" class="desc-col">फ़ीस / ब्याज<br><small>(केवल मद का नाम)</small></th>
                <th rowspan="2">पुनः<br>प्रवेश</th>
                <th rowspan="2">छात्र<br>पत्रावली</th>
                <th rowspan="2">विलम्ब</th>
                <th rowspan="2">महंगाई</th>
                <th colspan="2">प्राप्त धन दैनिक योग</th>
                <th colspan="2">पिछला रोकड़</th>
                <th colspan="2">कुल योग</th>
                <th rowspan="2">दिनांक</th>
                <th rowspan="2" class="desc-col">वाउचर विवरण<br><small>(केवल व्यय/चालान मद)</small></th>
                <th colspan="2">दिया गया दैनिक योग</th>
                <th colspan="2">शेष रोकड़</th>
                <th colspan="2">बैंक में पैसा</th>
                <th colspan="2">तिजोरी में पैसा</th>
                <th rowspan="2" class="action-col">एक्शन</th>
              </tr>
              <tr>
                <th>रुपये</th><th>पैसा</th>
                <th>रुपये</th><th>पैसा</th>
                <th>रुपये</th><th>पैसा</th>
                <th>रुपये</th><th>पैसा</th>
                <th>रुपये</th><th>पैसा</th>
                <th>रुपये</th><th>पैसा</th>
                <th>रुपये</th><th>पैसा</th>
              </tr>
            </thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        `;
        container.appendChild(pageDiv);
      });

      document.getElementById('topBankBal').textContent = fmtMoney(runningBank);
      document.getElementById('topCashBal').textContent = fmtMoney(runningCash);
    }

    function addParaBreak() {
      if (state.entries.length === 0) {
        alert('पैरा ब्रेक लगाने के लिए कम से कम एक प्रविष्टि होनी चाहिए।');
        return;
      }
      const lastId = state.entries[state.entries.length - 1].id;
      if (state.pageBreaks.includes(lastId)) {
        alert('अंतिम प्रविष्टि के बाद पहले से ही पैरा ब्रेक लगा हुआ है।');
        return;
      }
      state.pageBreaks.push(lastId);
      saveState();
      renderLedger();
    }

    function deleteEntry(id) {
      if (!confirm('क्या आप इस प्रविष्टि को स्थायी रूप से हटाना चाहते हैं?')) return;
      state.entries = state.entries.filter(e => e.id !== id);
      state.pageBreaks = state.pageBreaks.filter(bid => bid !== id);
      saveState();
      renderLedger();
    }

    function closeModal() {
      const existing = document.getElementById('dynamicModal');
      if (existing) existing.remove();
    }

    function openEntryModal(editId = null) {
      closeModal();
      const editItem = editId ? state.entries.find(e => e.id === editId) : null;
      const defaultDate = editItem ? editItem.date : new Date().toISOString().split('T')[0];
      const defaultType = editItem ? editItem.type : 'fee';

      const modal = document.createElement('div');
      modal.id = 'dynamicModal';
      modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="modal-box">
          <div class="modal-hdr">
            <span>${editItem ? 'प्रविष्टि संपादित करें (Update Entry)' : 'नई लेखा प्रविष्टि दर्ज करें'}</span>
            <button class="close-modal" onclick="closeModal()">×</button>
          </div>
          <div class="form-grid">
            <div class="form-group">
              <label>प्रविष्टि का प्रकार *</label>
              <select id="mType" onchange="toggleEntryFields()">
                <option value="fee" ${defaultType === 'fee' ? 'selected' : ''}>1) फ़ीस जमा </option>
                <option value="bank_deposit" ${defaultType === 'bank_deposit' ? 'selected' : ''}>2)  बैंक में नकद जमा</option>
                <option value="govt_challan" ${defaultType === 'govt_challan' ? 'selected' : ''}>3) सरकारी फ़ीस चालान द्वारा जमा (व्यय पक्ष)</option>
                <option value="interest" ${defaultType === 'interest' ? 'selected' : ''}>4) बैंक द्वारा दिया गया ब्याज</option>
                <option value="expense" ${defaultType === 'expense' ? 'selected' : ''}>5) सामान्य वाउचर भुगतान / व्यय</option>
              </select>
            </div>
            <div class="form-group">
              <label>दिनांक *</label>
              <input type="date" id="mDate" value="${defaultDate}">
            </div>
          </div>
          <div id="dynamicFields"></div>
          <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:15px;">
            <button class="btn btn-settings" onclick="closeModal()">रद्द करें</button>
            <button class="btn btn-primary" onclick="submitEntry(${editId})">${editItem ? 'अपडेट सुरक्षित करें' : 'पंजिका में सुरक्षित करें'}</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
      toggleEntryFields(editItem);
    }

    function toggleEntryFields(editItem = null) {
      const type = document.getElementById('mType').value;
      const box = document.getElementById('dynamicFields');
      if (type === 'fee') {
        box.innerHTML = `
          <div class="info-strip">नियम: एक माह में अधिकतम 4 बार फ़ीस जमा। 'फ़ीस / ब्याज' कॉलम में केवल मद का नाम दिखेगा।</div>
          <div class="form-grid">
            <div class="form-group"><label>मद का टेक्स्ट नाम *</label><input type="text" id="mDesc" value="${editItem && editItem.desc ? editItem.desc : ''}" placeholder="जैसे: मासिक फ़ीस (किस्त 1/4)"></div>
            <div class="form-group"><label>मूल फ़ीस राशि (₹)</label><input type="number" step="0.01" id="mFeeBase" value="${editItem && editItem.feeBase !== undefined ? editItem.feeBase : 0}"></div>
            <div class="form-group"><label>पुनः प्रवेश (₹)</label><input type="number" step="0.01" id="mReAdm" value="${editItem && editItem.reAdm ? editItem.reAdm : 0}"></div>
            <div class="form-group"><label>छात्र पत्रावली (₹)</label><input type="number" step="0.01" id="mFileFee" value="${editItem && editItem.fileFee ? editItem.fileFee : 0}"></div>
            <div class="form-group"><label>विलम्ब शुल्क (₹)</label><input type="number" step="0.01" id="mLateFee" value="${editItem && editItem.lateFee ? editItem.lateFee : 0}"></div>
            <div class="form-group"><label>महंगाई शुल्क (₹)</label><input type="number" step="0.01" id="mDaFee" value="${editItem && editItem.daFee ? editItem.daFee : 0}"></div>
          </div>
        `;
      } else if (type === 'bank_deposit') {
        const vText = editItem ? (editItem.voucher || editItem.desc || 'तिजोरी से बैंक खाता में जमा') : 'तिजोरी से बैंक खाता में जमा';
        box.innerHTML = `
          <div class="info-strip">तिजोरी से घटकर बैंक खाते में जुड़ेगा तथा विवरण 'वाउचर विवरण' कॉलम में दिखेगा।</div>
          <div class="form-grid">
            <div class="form-group"><label>वाउचर / बैंक जमा विवरण *</label><input type="text" id="mVoucher" value="${vText}"></div>
            <div class="form-group"><label>बैंक में जमा राशि (₹) *</label><input type="number" step="0.01" id="mAmount" value="${editItem ? editItem.amount : ''}" placeholder="0.00"></div>
          </div>
        `;
      } else if (type === 'interest') {
        box.innerHTML = `
          <div class="info-strip">बैंक पासबुक के अनुसार प्राप्त ब्याज की प्रविष्टि।</div>
          <div class="form-grid">
            <div class="form-group"><label>मद का टेक्स्ट नाम *</label><input type="text" id="mDesc" value="${editItem && editItem.desc ? editItem.desc : 'बैंक बचत खाते का ब्याज'}"></div>
            <div class="form-group"><label>ब्याज राशि (₹) *</label><input type="number" step="0.01" id="mAmount" value="${editItem ? editItem.amount : ''}" placeholder="0.00"></div>
          </div>
        `;
      } else {
        const isChallan = type === 'govt_challan';
        const modeVal = editItem ? editItem.mode : 'bank';
        box.innerHTML = `
          <div class="info-strip">${isChallan ? 'सरकारी चालान प्रेषण दाएँ पक्ष में जुड़ेगा।' : 'वास्तविक व्यय दाएँ पक्ष में जुड़ेगा।'}</div>
          <div class="form-grid">
            <div class="form-group"><label>वाउचर / चालान मद का नाम *</label><input type="text" id="mVoucher" value="${editItem && editItem.voucher ? editItem.voucher : ''}" placeholder="${isChallan ? 'जैसे: सरकारी फ़ीस चालान सं. 02' : 'जैसे: वाउचर सं. 01 - स्टेशनरी क्रय'}"></div>
            <div class="form-group"><label>भुगतान माध्यम *</label>
              <select id="mMode">
                <option value="bank" ${modeVal === 'bank' ? 'selected' : ''}>बैंक खाता / चालान से</option>
                <option value="cash" ${modeVal === 'cash' ? 'selected' : ''}>तिजोरी (नकद) से</option>
              </select>
            </div>
            <div class="form-group"><label>राशि (₹) *</label><input type="number" step="0.01" id="mAmount" value="${editItem ? editItem.amount : ''}" placeholder="0.00"></div>
          </div>
        `;
      }
    }

    function submitEntry(editId = null) {
      const type = document.getElementById('mType').value;
      const date = document.getElementById('mDate').value;
      if (!date) return alert('कृपया दिनांक चुनें।');

      let newEntryObj = null;

      if (type === 'fee') {
        const ym = date.slice(0, 7);
        const countInMonth = state.entries.filter(e => e.type === 'fee' && e.date.startsWith(ym) && e.id !== editId).length;
        if (countInMonth >= 4) {
          return alert('नियम: इस माह में पहले ही 4 बार फ़ीस जमा हो चुकी है!');
        }
        const desc = document.getElementById('mDesc').value.trim();
        const feeBase = Number(document.getElementById('mFeeBase').value) || 0;
        const reAdm = Number(document.getElementById('mReAdm').value) || 0;
        const fileFee = Number(document.getElementById('mFileFee').value) || 0;
        const lateFee = Number(document.getElementById('mLateFee').value) || 0;
        const daFee = Number(document.getElementById('mDaFee').value) || 0;
        const total = feeBase + reAdm + fileFee + lateFee + daFee;
        if (!desc || total <= 0) return alert('कृपया मद का नाम और सही राशि भरें।');

        newEntryObj = { id: editId || Date.now(), type, date, desc, feeBase, reAdm, fileFee, lateFee, daFee, amount: total, voucher: '', mode: 'cash' };
      } else if (type === 'bank_deposit') {
        const voucher = document.getElementById('mVoucher').value.trim();
        const amount = Number(document.getElementById('mAmount').value) || 0;
        if (!voucher || amount <= 0) return alert('कृपया विवरण और राशि भरें।');
        newEntryObj = { id: editId || Date.now(), type, date, desc: '', amount, voucher, mode: 'transfer' };
      } else if (type === 'interest') {
        const desc = document.getElementById('mDesc').value.trim();
        const amount = Number(document.getElementById('mAmount').value) || 0;
        if (!desc || amount <= 0) return alert('कृपया विवरण और राशि भरें।');
        newEntryObj = { id: editId || Date.now(), type, date, desc, amount, voucher: '', mode: 'bank' };
      } else {
        const voucher = document.getElementById('mVoucher').value.trim();
        const mode = document.getElementById('mMode').value;
        const amount = Number(document.getElementById('mAmount').value) || 0;
        if (!voucher || amount <= 0) return alert('कृपया वाउचर विवरण और राशि भरें।');
        newEntryObj = { id: editId || Date.now(), type, date, desc: '', amount, voucher, mode };
      }

      if (editId) {
        const idx = state.entries.findIndex(e => e.id === editId);
        if (idx !== -1) state.entries[idx] = newEntryObj;
      } else {
        state.entries.push(newEntryObj);
      }

      saveState();
      closeModal();
      renderLedger();
    }

    function openPassbookModal() {
      closeModal();
      let pbBal = Number(state.openingBank) || 0;
      const opDateFormatted = fmtDate(state.openingDate || '2026-04-01');
      let pbRows = `<tr><td>${opDateFormatted}</td><td class="text-left">प्रारंभिक बैंक अवशेष</td><td class="num">—</td><td class="num">—</td><td class="num"><strong>${fmtMoney(pbBal)}</strong></td></tr>`;

      state.entries.forEach(e => {
        if (e.type === 'bank_deposit') {
          pbBal += e.amount;
          const label = e.voucher || e.desc || 'तिजोरी से बैंक खाता में जमा';
          pbRows += `<tr><td>${fmtDate(e.date)}</td><td class="text-left">${label}</td><td class="num">—</td><td class="num" style="color:#15803d;">+${fmtMoney(e.amount)}</td><td class="num"><strong>${fmtMoney(pbBal)}</strong></td></tr>`;
        } else if (e.type === 'interest') {
          pbBal += e.amount;
          pbRows += `<tr><td>${fmtDate(e.date)}</td><td class="text-left">${e.desc}</td><td class="num">—</td><td class="num" style="color:#15803d;">+${fmtMoney(e.amount)}</td><td class="num"><strong>${fmtMoney(pbBal)}</strong></td></tr>`;
        } else if ((e.type === 'expense' || e.type === 'govt_challan') && e.mode === 'bank') {
          pbBal -= e.amount;
          pbRows += `<tr><td>${fmtDate(e.date)}</td><td class="text-left">${e.voucher}</td><td class="num" style="color:#dc2626;">-${fmtMoney(e.amount)}</td><td class="num">—</td><td class="num"><strong>${fmtMoney(pbBal)}</strong></td></tr>`;
        }
      });

      const modal = document.createElement('div');
      modal.id = 'dynamicModal';
      modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="modal-box wide">
          <div class="modal-hdr">
            <span>📒 बैंक पासबुक विवरण एवं मिलान (खाता सं.: ${state.accountNo})</span>
            <button class="close-modal" onclick="closeModal()">×</button>
          </div>
          <div class="info-strip">पंजिका अनुसार बैंक में पैसा: <strong>${fmtMoney(pbBal)}</strong> | पासबुक का अंतिम शेष स्वतः सिंक है।</div>
          <table class="ledger" style="min-width:100%;">
            <thead>
              <tr><th>दिनांक</th><th>विवरण / चालान / वाउचर</th><th>नाम / डेबिट (निकासी)</th><th>जमा / क्रेडिट</th><th>बैंक पासबुक शेष</th></tr>
            </thead>
            <tbody>${pbRows}</tbody>
          </table>
          <div style="text-align:right; margin-top:12px;">
            <button class="btn btn-primary" onclick="closeModal()">बंद करें</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    function openSettingsModal() {
      closeModal();
      const modal = document.createElement('div');
      modal.id = 'dynamicModal';
      modal.className = 'modal-overlay';
      modal.innerHTML = `
        <div class="modal-box">
          <div class="modal-hdr">
            <span>⚙️ विद्यालय विवरण एवं प्रारंभिक अवशेष</span>
            <button class="close-modal" onclick="closeModal()">×</button>
          </div>
          <div class="form-grid">
            <div class="form-group"><label>विद्यालय का नाम</label><input type="text" id="sName" value="${state.schoolName}"></div>
            <div class="form-group"><label>शैक्षणिक सत्र</label><input type="text" id="sSession" value="${state.session}"></div>
            <div class="form-group"><label>बैंक खाता संख्या</label><input type="text" id="sAcc" value="${state.accountNo}"></div>
            <div class="form-group"><label>प्रारंभिक अवशेष की दिनांक</label><input type="date" id="sOpDate" value="${state.openingDate || '2026-04-01'}"></div>
            <div class="form-group"><label>प्रारंभिक बैंक में पैसा (₹)</label><input type="number" step="0.01" id="sOpBank" value="${state.openingBank}"></div>
            <div class="form-group"><label>प्रारंभिक तिजोरी में पैसा (₹)</label><input type="number" step="0.01" id="sOpCash" value="${state.openingCash}"></div>
          </div>
          <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:14px;">
            <button class="btn btn-settings" onclick="closeModal()">रद्द करें</button>
            <button class="btn btn-primary" onclick="saveSettings()">सुरक्षित करें</button>
          </div>
        </div>
      `;
      document.body.appendChild(modal);
    }

    function saveSettings() {
      state.schoolName = document.getElementById('sName').value.trim() || state.schoolName;
      state.session = document.getElementById('sSession').value.trim() || state.session;
      state.accountNo = document.getElementById('sAcc').value.trim() || state.accountNo;
      state.openingDate = document.getElementById('sOpDate').value || state.openingDate;
      state.openingBank = Number(document.getElementById('sOpBank').value) || 0;
      state.openingCash = Number(document.getElementById('sOpCash').value) || 0;
      saveState();
      closeModal();
      renderLedger();
    }

    function resetAllData() {
      if (!confirm('क्या आप सभी प्रविष्टियाँ स्थायी रूप से मिटाकर नई खाली पंजिका शुरू करना चाहते हैं?')) return;
      state.entries = [];
      state.pageBreaks = [];
      saveState();
      renderLedger();
    }

    loadState();
    renderLedger();
  </script>
</body>
</html>
