<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>रोकड़ पंजीका (Cash Book System)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #e2e8f0; padding: 10px; display: flex; flex-direction: column; align-items: center; }
        .cashbook-container { width: 100%; max-width: 1700px; background: white; padding: 15px; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); overflow-x: auto; }
        
        .header-controls { display: flex; gap: 15px; background: #2d3748; color: white; padding: 10px; border-radius: 4px; margin-bottom: 10px; align-items: center; }
        .header-controls label { font-weight: bold; font-size: 0.85rem; }
        .header-controls select, .header-controls input { padding: 4px 8px; border-radius: 3px; border: 1px solid #ccc; font-weight: bold; }
        
        table.cashbook { width: 100%; border-collapse: collapse; font-size: 0.75rem; text-align: center; }
        table.cashbook th, table.cashbook td { border: 1px solid #1a202c; padding: 3px 2px; height: 26px; }
        
        .th-green { background-color: #86efac; color: #000; font-weight: bold; }
        .th-month { background-color: #86efac; font-size: 1.1rem; font-weight: bold; color: #000; border-top: none; }
        
        .paisa-col { background-color: #fef08a; width: 16px; font-size: 0.6rem; }
        .sep-col { background-color: #4a5568; width: 8px; }
        .light-blue-bg { background-color: #dbeafe; }
        
        table.cashbook input { width: 100%; border: none; background: transparent; text-align: center; font-weight: bold; font-size: 0.8rem; outline: none; }
        
        .summary-row { background-color: #dbeafe; font-weight: bold; }
        
        .btn-bar { margin-top: 10px; display: flex; gap: 10px; justify-content: flex-end; }
        button { padding: 6px 14px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; font-size: 0.8rem; }
        .btn-add { background-color: #2563eb; }
        .btn-save { background-color: #16a34a; }
        .btn-clear { background-color: #d97706; }
        .btn-reset { background-color: #dc2626; }
        .btn-del { background-color: #ef4444; padding: 1px 4px; font-size: 0.7rem; border-radius: 2px; }

        /* अलग कैलकुलेटर की स्टाइलिंग */
        .calculator-wrapper {
            margin-top: 25px;
            width: 300px;
            background: #1e293b;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
            align-self: center;
        }
        .calculator-wrapper h3 {
            color: white;
            text-align: center;
            font-size: 0.95rem;
            margin-bottom: 10px;
            border-bottom: 1px solid #475569;
            padding-bottom: 5px;
        }
        .calc-display {
            width: 100%;
            height: 40px;
            background: #0f172a;
            color: #38bdf8;
            text-align: right;
            padding: 5px 10px;
            font-size: 1.2rem;
            font-weight: bold;
            border: 1px solid #334155;
            border-radius: 5px;
            margin-bottom: 12px;
            outline: none;
        }
        .calc-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .calc-btn {
            height: 38px;
            background: #334155;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .calc-btn:hover { background: #475569; }
        .calc-btn:active { background: #64748b; }
        .calc-btn.op { background: #2563eb; }
        .calc-btn.op:hover { background: #1d4ed8; }
        .calc-btn.action { background: #dc2626; }
        .calc-btn.action:hover { background: #b91c1c; }
        .calc-btn.equal { background: #16a34a; grid-column: span 2; }
        .calc-btn.equal:hover { background: #15803d; }
    </style>
</head>
<body>

<div class="cashbook-container">
    <div class="header-controls">
        <label>माह:</label>
        <select id="monthSelect" onchange="changeMonth()">
            <option value="0">Apr-24</option><option value="1">May-24</option><option value="2">Jun-24</option>
            <option value="3">Jul-24</option><option value="4">Aug-24</option><option value="5">Sep-24</option>
            <option value="6">Oct-24</option><option value="7">Nov-24</option><option value="8">Dec-24</option>
            <option value="9">Jan-25</option><option value="10">Feb-25</option><option value="11">Mar-25</option>
        </select>
        <!-- अप्रैल के लिए ओपनिंग बैलेंस इनपुट -->
        <div id="aprilOpenContainer" style="display: flex; align-items: center; gap: 5px; margin-left: 20px;">
            <label>अप्रैल पिछला रोकड़ (Opening):</label>
            <input type="number" id="aprilOpenInput" style="background: white; color: black; width: 100px; padding: 3px; border-radius: 3px;" oninput="updateAprilOpening()">
        </div>
        <div style="margin-left:auto; font-weight:bold;" id="tallyStatus">स्थिति: मैच ✓</div>
    </div>

    <table class="cashbook">
        <thead>
            <tr class="th-green">
                <th style="width: 45px;">दिनांक</th>
                <th style="width: 45px;">फ़ीस /ब्याज</th>
                <th style="width: 45px;">पुनः प्रवेश</th>
                <th style="width: 45px;">छात्र पत्रावली</th>
                <th style="width: 45px;">विलम्ब</th>
                <th style="width: 45px;">महंगाई</th>
                <th class="sep-col"></th>
                <th style="width: 50px;">प्राप्त धन</th>
                <th style="width: 50px;">दैनिक योग</th>
                <th class="paisa-col">पैसा</th>
                <th style="width: 55px;">पिछला रोकण</th>
                <th class="paisa-col">पैसा</th>
                <th style="width: 55px;">कुल योग</th>
                <th class="paisa-col">पैसा</th>
                <th class="sep-col"></th>
                <th style="width: 45px;">दिनांक</th>
                <th style="width: 60px;">वाउचर</th>
                <th style="width: 50px;">दिया गया</th>
                <th style="width: 50px;">दैनिक योग</th>
                <th style="width: 55px;">शेष रोकण</th>
                <th class="paisa-col">पैसा</th>
                <th style="width: 55px;">बैंक में</th>
                <th class="paisa-col">पैसा</th>
                <th style="width: 55px;">तिजोरी में</th>
                <th class="paisa-col">पैसा</th>
                <th style="width: 25px;">X</th>
            </tr>
            <tr>
                <td colspan="26" class="th-month" id="monthBanner">Apr-24</td>
            </tr>
        </thead>

        <tbody id="tableBody">
            <!-- Data Rows -->
        </tbody>

        <tfoot>
            <tr class="summary-row">
                <td colspan="8"></td>
                <td><input type="number" id="totPrapteDhan" readonly></td>
                <td class="paisa-col"></td><td></td><td class="paisa-col"></td><td></td><td class="paisa-col"></td>
                <td class="sep-col"></td><td></td><td></td><td></td>
                <td><input type="number" id="totDiyaGaya" readonly></td>
                <td colspan="7"></td>
            </tr>
            <tr class="summary-row">
                <td colspan="8"></td>
                <td><input type="number" id="totOpening" readonly></td>
                <td class="paisa-col"></td><td></td><td class="paisa-col"></td><td></td><td class="paisa-col"></td>
                <td class="sep-col"></td><td></td><td></td><td></td>
                <td><input type="number" id="totFinalRem" readonly></td>
                <td colspan="7"></td>
            </tr>
            <tr class="summary-row">
                <td colspan="8"></td>
                <td><input type="number" id="totGrandLeft" readonly></td>
                <td class="paisa-col"></td><td></td><td class="paisa-col"></td><td></td><td class="paisa-col"></td>
                <td class="sep-col"></td><td></td><td></td><td></td>
                <td><input type="number" id="totGrandRight" readonly></td>
                <td colspan="7"></td>
            </tr>
        </tfoot>
    </table>

    <div class="btn-bar">
        <button class="btn-add" onclick="addRow()">+ पंक्ति जोड़ें</button>
        <button class="btn-save" onclick="saveData()">सुरक्षित करें (Save)</button>
        <button class="btn-clear" onclick="clearMonth()">यह महीना साफ़ करें</button>
        <button class="btn-reset" onclick="resetAll()">पूरा रिसेट करें</button>
    </div>

    <!-- अलग से कैलकुलेटर जोड़ें -->
    <div class="calculator-wrapper">
        <h3>गणक (Calculator)</h3>
        <input type="text" id="calcDisplay" class="calc-display" readonly value="0">
        <div class="calc-grid">
            <button class="calc-btn action" onclick="calcClear()">C</button>
            <button class="calc-btn action" onclick="calcBackspace()">⌫</button>
            <button class="calc-btn op" onclick="calcAppend('%')">%</button>
            <button class="calc-btn op" onclick="calcAppend('/')">÷</button>

            <button class="calc-btn" onclick="calcAppend('7')">7</button>
            <button class="calc-btn" onclick="calcAppend('8')">8</button>
            <button class="calc-btn" onclick="calcAppend('9')">9</button>
            <button class="calc-btn op" onclick="calcAppend('*')">×</button>

            <button class="calc-btn" onclick="calcAppend('4')">4</button>
            <button class="calc-btn" onclick="calcAppend('5')">5</button>
            <button class="calc-btn" onclick="calcAppend('6')">6</button>
            <button class="calc-btn op" onclick="calcAppend('-')">-</button>

            <button class="calc-btn" onclick="calcAppend('1')">1</button>
            <button class="calc-btn" onclick="calcAppend('2')">2</button>
            <button class="calc-btn" onclick="calcAppend('3')">3</button>
            <button class="calc-btn op" onclick="calcAppend('+')">+</button>

            <button class="calc-btn" onclick="calcAppend('0')">0</button>
            <button class="calc-btn" onclick="calcAppend('.')">.</button>
            <button class="calc-btn equal" onclick="calcEvaluate()">=</button>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'cashbook_footer_tally_shifted';
    const monthsName = ["Apr-24", "May-24", "Jun-24", "Jul-24", "Aug-24", "Sep-24", "Oct-24", "Nov-24", "Dec-24", "Jan-25", "Feb-25", "Mar-25"];
    
    let yearlyData = Array.from({ length: 12 }, () => ({
        openBal: 11017,
        rows: []
    }));

    let currentMonthIdx = 0;

    function initDefaultData() {
        yearlyData[0] = {
            openBal: 11017,
            rows: [
                { date: '', type: '', f1: '', f2: '', f3: '', f4: '', intVal: '', expDate: '', voucher: '', expAmt: '', manualBank: '' },
                { date: '', type: 'INT', f1: '', f2: '', f3: '', f4: '', intVal: '22', expDate: '', voucher: '', expAmt: '', manualBank: '' },
                { date: '', type: 'FEE', f1: '1000', f2: '200', f3: '300', f4: '500', intVal: '', expDate: '', voucher: '', expAmt: '', manualBank: '' },
                { date: '', type: 'FEE', f1: '200', f2: '300', f3: '100', f4: '20', intVal: '', expDate: '', voucher: '', expAmt: '', manualBank: '' },
                { date: '', type: 'FEE', f1: '100', f2: '2000', f3: '100', f4: '300', intVal: '', expDate: '', voucher: '', expAmt: '', manualBank: '' },
                { date: '', type: 'FEE', f1: '', f2: '', f3: '', f4: '', intVal: '', expDate: '', voucher: '', expAmt: '', manualBank: '' },
                { date: '', type: 'FEE', f1: '', f2: '', f3: '', f4: '', intVal: '', expDate: '', voucher: '', expAmt: '', manualBank: '' },
                { date: '', type: 'INT', f1: '', f2: '', f3: '', f4: '', intVal: '', expDate: '', voucher: '', expAmt: '', manualBank: '' },
                { date: '', type: 'INT', f1: '', f2: '', f3: '', f4: '', intVal: '', expDate: '', voucher: '', expAmt: '', manualBank: '12000' },
                { date: '', type: '', f1: '', f2: '', f3: '', f4: '', intVal: '', expDate: '', voucher: 'BANK', expAmt: '3000', manualBank: '' }
            ]
        };
    }

    function renderRows() {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        let mData = yearlyData[currentMonthIdx];

        document.getElementById('aprilOpenInput').value = yearlyData[0].openBal;
        document.getElementById('aprilOpenContainer').style.display = (currentMonthIdx === 0) ? 'flex' : 'none';

        mData.rows.forEach((r, idx) => {
            const tr = document.createElement('tr');
            tr.className = 'light-blue-bg data-row';
            tr.innerHTML = `
                <td><input type="text" class="r-date" value="${r.date||''}"></td>
                <td><input type="text" class="r-type" value="${r.type||''}" oninput="calculate()"></td>
                <td><input type="number" class="fee1" value="${r.f1||''}" oninput="calculate()"></td>
                <td><input type="number" class="fee2" value="${r.f2||''}" oninput="calculate()"></td>
                <td><input type="number" class="fee3" value="${r.f3||''}" oninput="calculate()"></td>
                <td><input type="number" class="fee4" value="${r.f4||''}" oninput="calculate()"></td>
                <td class="sep-col"></td>
                <td><input type="number" class="int-val" value="${r.intVal||''}" oninput="calculate()"></td>
                <td><input type="number" class="row-daily" readonly></td><td class="paisa-col"></td>
                <td><input type="number" class="row-prev" readonly></td><td class="paisa-col"></td>
                <td><input type="number" class="row-total" readonly></td><td class="paisa-col"></td>
                <td class="sep-col"></td>
                <td><input type="text" class="exp-date" value="${r.expDate||''}"></td>
                <td><input type="text" class="exp-voucher" value="${r.voucher||''}" oninput="calculate()"></td>
                <td><input type="number" class="exp-amount" value="${r.expAmt||''}" oninput="calculate()"></td>
                <td><input type="number" class="exp-daily" readonly></td>
                <td><input type="number" class="row-rem" readonly></td><td class="paisa-col"></td>
                <td><input type="number" class="manual-bank" value="${r.manualBank||''}" oninput="calculate()"></td><td class="paisa-col"></td>
                <td><input type="number" class="row-vault" readonly></td><td class="paisa-col"></td>
                <td><button class="btn-del" onclick="deleteRow(${idx})">X</button></td>
            `;
            tbody.appendChild(tr);
        });

        calculate();
    }

    function updateAprilOpening() {
        let val = parseFloat(document.getElementById('aprilOpenInput').value);
        yearlyData[0].openBal = isNaN(val) ? 0 : val;
        calculate();
    }

    function addRow() {
        yearlyData[currentMonthIdx].rows.push({ date: '', type: '', f1: '', f2: '', f3: '', f4: '', intVal: '', expDate: '', voucher: '', expAmt: '', manualBank: '' });
        renderRows();
    }

    function deleteRow(idx) {
        yearlyData[currentMonthIdx].rows.splice(idx, 1);
        renderRows();
    }

    function calculate() {
        saveUIState();

        let carryOverBal = yearlyData[0].openBal;

        for (let m = 0; m < 12; m++) {
            yearlyData[m].openBal = carryOverBal;
            let currentPrev = carryOverBal;
            let rowsUI = (m === currentMonthIdx) ? document.querySelectorAll('.data-row') : null;

            yearlyData[m].rows.forEach((r, idx) => {
                let f1 = parseFloat(r.f1) || 0;
                let f2 = parseFloat(r.f2) || 0;
                let f3 = parseFloat(r.f3) || 0;
                let f4 = parseFloat(r.f4) || 0;
                let intVal = parseFloat(r.intVal) || 0;
                let expAmt = parseFloat(r.expAmt) || 0;
                let voucher = (r.voucher || '').toUpperCase();
                let typeStr = (r.type || '').toUpperCase();

                let feeSum = f1 + f2 + f3 + f4;
                let hasIncomeInput = (feeSum > 0 || intVal > 0);
                let prapteDhan = feeSum > 0 ? feeSum : (intVal > 0 ? intVal : 0);
                
                let displayPrev = '';
                let displayTotal = '';

                if (hasIncomeInput || idx === 0) {
                    displayPrev = currentPrev;
                    displayTotal = currentPrev + prapteDhan;
                    currentPrev = displayTotal - expAmt;
                } else {
                    currentPrev = currentPrev - expAmt;
                }

                let remBal = (displayTotal !== '') ? (displayTotal - expAmt) : currentPrev;

                let manualBankInput = r.manualBank !== '' ? parseFloat(r.manualBank) : NaN;
                
                let displayRemBal = '';
                let displayBank = '';
                let displayVault = '';

                if (!isNaN(manualBankInput)) {
                    displayRemBal = remBal;
                    displayBank = manualBankInput;
                    displayVault = remBal - manualBankInput;
                } else if (typeStr.includes('INT') && intVal > 0) {
                    // ब्याज (INT) का पैसा सीधे बैंक में जाएगा और तिजोरी खाली रहेगी
                    displayRemBal = remBal;
                    displayBank = remBal;
                    displayVault = '';
                } else if (voucher.includes('BANK') || voucher.includes('CHALLAN') || voucher.includes('CHALAN')) {
                    displayRemBal = remBal;
                    displayBank = remBal;
                    displayVault = 0;
                } else if (idx === 0) {
                    displayRemBal = remBal;
                    displayBank = remBal;
                    displayVault = '';
                }

                if (m === currentMonthIdx && rowsUI && rowsUI[idx]) {
                    let rowEl = rowsUI[idx];
                    rowEl.querySelector('.row-daily').value = prapteDhan > 0 ? prapteDhan : '';
                    rowEl.querySelector('.row-prev').value = displayPrev !== '' ? displayPrev : '';
                    rowEl.querySelector('.row-total').value = displayTotal !== '' ? displayTotal : '';
                    rowEl.querySelector('.exp-daily').value = expAmt > 0 ? expAmt : '';
                    rowEl.querySelector('.row-rem').value = displayRemBal;
                    rowEl.querySelector('.manual-bank').value = displayBank !== '' ? displayBank : '';
                    rowEl.querySelector('.row-vault').value = displayVault !== '' ? displayVault : '';
                }
            });

            carryOverBal = currentPrev;
        }

        updateSummary();
    }

    function updateSummary() {
        let mData = yearlyData[currentMonthIdx];
        let totPrapte = 0;
        let totDiya = 0;

        mData.rows.forEach(r => {
            let f = (parseFloat(r.f1)||0)+(parseFloat(r.f2)||0)+(parseFloat(r.f3)||0)+(parseFloat(r.f4)||0)+(parseFloat(r.intVal)||0);
            totPrapte += f;
            totDiya += (parseFloat(r.expAmt)||0);
        });

        document.getElementById('totPrapteDhan').value = totPrapte;
        document.getElementById('totOpening').value = mData.openBal;
        document.getElementById('totGrandLeft').value = mData.openBal + totPrapte;

        document.getElementById('totDiyaGaya').value = totDiya;
        let lastRem = mData.rows.length > 0 ? (mData.openBal + totPrapte - totDiya) : mData.openBal;
        document.getElementById('totFinalRem').value = lastRem;
        document.getElementById('totGrandRight').value = totDiya + lastRem;

        document.getElementById('monthBanner').innerText = monthsName[currentMonthIdx];
    }

    function saveUIState() {
        let rows = [];
        document.querySelectorAll('.data-row').forEach(row => {
            rows.push({
                date: row.querySelector('.r-date').value,
                type: row.querySelector('.r-type').value,
                f1: row.querySelector('.fee1').value,
                f2: row.querySelector('.fee2').value,
                f3: row.querySelector('.fee3').value,
                f4: row.querySelector('.fee4').value,
                intVal: row.querySelector('.int-val').value,
                expDate: row.querySelector('.exp-date').value,
                voucher: row.querySelector('.exp-voucher').value,
                expAmt: row.querySelector('.exp-amount').value,
                manualBank: row.querySelector('.manual-bank').value
            });
        });
        yearlyData[currentMonthIdx].rows = rows;
    }

    function changeMonth() {
        saveUIState();
        currentMonthIdx = parseInt(document.getElementById('monthSelect').value);
        renderRows();
    }

    function saveData() {
        saveUIState();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(yearlyData));
        alert('डाटा सुरक्षित कर दिया गया है!');
    }

    function clearMonth() {
        if(confirm(`${monthsName[currentMonthIdx]} का डाटा साफ़ करें?`)) {
            yearlyData[currentMonthIdx].rows = [];
            renderRows();
        }
    }

    function resetAll() {
        if(confirm("पूरा रिसेट करें?")) {
            localStorage.removeItem(STORAGE_KEY);
            initDefaultData();
            currentMonthIdx = 0;
            document.getElementById('monthSelect').value = "0";
            renderRows();
        }
    }

    /* अलग से कैलकुलेटर का लॉजिक */
    let calcVal = "0";
    
    function updateCalcDisplay() {
        document.getElementById('calcDisplay').value = calcVal;
    }

    function calcAppend(char) {
        if (calcVal === "0" || calcVal === "Error") {
            if (['+', '*', '/', '%'].includes(char)) return;
            calcVal = char;
        } else {
            calcVal += char;
        }
        updateCalcDisplay();
    }

    function calcClear() {
        calcVal = "0";
        updateCalcDisplay();
    }

    function calcBackspace() {
        if (calcVal.length === 1 || calcVal === "Error") {
            calcVal = "0";
        } else {
            calcVal = calcVal.slice(0, -1);
        }
        updateCalcDisplay();
    }

    function calcEvaluate() {
        try {
            // प्रतिशत (%) गणना को संभालने के लिए रिप्लेसमेंट
            let expr = calcVal.replace(/(\d+(\.\d+)?)%/g, '($1/100)');
            let result = eval(expr);
            calcVal = String(Number(result.toFixed(4))); // 4 दशमलव स्थान तक शुद्ध परिणाम
        } catch (e) {
            calcVal = "Error";
        }
        updateCalcDisplay();
    }

    window.onload = function() {
        let saved = localStorage.getItem(STORAGE_KEY);
        if(saved) {
            yearlyData = JSON.parse(saved);
        } else {
            initDefaultData();
        }
        renderRows();
    };
</script>

</body>
</html>
